}

/* ---------- vue éditeur ---------- */
function openEditor(id){
  const src = id ? state.routes.find(r=>r.id===id) : null;
  state.draft = src ? JSON.parse(JSON.stringify(src)) :
    {id:"r"+Date.now().toString(36), name:"", isDefault:false, points:[],
     aller:{start:"09:00",end:"09:00"}, retour:{on:false,start:"17:00",end:"17:00"}, legs:null, legsKey:"", legsSource:""};
  state.isNew=!src; state.confirmDelete=false; state.routingErr=false; state.view="edit";
  render(); window.scrollTo(0,0);
}
function searchLabel(d){
  const n=d.points.length;
  if(state.dayCtx) return n===0 ? "Point de départ de la journée" : n===1 ? "Étape ou lieu de la nuitée" : "Ajouter une étape (la dernière = nuitée)";
  if(d.isDefault && n===0) return "Adresse de la maison";
  if(d.isDefault && n===1) return "Adresse du boulot";
  return n? "Ajouter une étape" : "Point de départ";
}
function slotPanel(d, which){
  const slot=d[which], reverse=which==="retour", ok=d.points.length>=2;
  const s=toMin(slot.start), e=toMin(slot.end);
  let out="";
  if(ok){
    const a=timeline(d,reverse,s), b=timeline(d,reverse,e);
    const np=a.at(-1).pauses, len=state.rules.pauseLen;
    out=`<div class="slot-out">Arrivée à <b>${esc(a.at(-1).pt.name)}</b> ${toMin(slot.start)===toMin(slot.end)?"vers":"entre"} <b>${fmtSlot(a.at(-1).min,b.at(-1).min).replace("–","</b> et <b>")}</b>${np?`, avec ${np} pause${np>1?"s":""} de ${len} min`:""}</div>`;
  }
  return `<div class="slot">
    <div class="row2">
      <div class="field"><label for="${which}-s">Départ au plus tôt</label><input type="time" id="${which}-s" value="${esc(slot.start)}"></div>
      <div class="field"><label for="${which}-e">Départ au plus tard</label><input type="time" id="${which}-e" value="${esc(slot.end)}"></div>
    </div>${out}</div>`;
}

  app.innerHTML = `
    <header class="top">

  $("gps").onclick=useMyPosition;
  ensureRouting();
}

/* ---------- recherche d'adresses et de villes ---------- */
const featToPlace = f => { const p=f.properties; return {
  name: p.type==="municipality" ? p.city : (p.name||p.label),
  ctx: [p.postcode, p.city].filter(Boolean).join(" "),
  lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]}; };
async function completeFR(text){
  // Géoplateforme IGN : autocomplétion d'adresses réelles en France, dès les premières lettres
  const r=await fetch("https://data.geopf.fr/geocodage/completion/?type=StreetAddress,PositionOfInterest&maximumResponses=6&text="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.results||[]).filter(x=>Number.isFinite(x.x)&&Number.isFinite(x.y)).map(x=>{
    const full=x.fulltext||[x.street,x.zipcode,x.city].filter(Boolean).join(" ");
    const cut=full.indexOf(",");
    return {name: cut>0?full.slice(0,cut):full, ctx: cut>0?full.slice(cut+1).trim():[x.zipcode,x.city].filter(Boolean).join(" "), lat:x.y, lon:x.x};
  });
}
async function searchFR(text){
  // repli : recherche plein texte (ex-API Adresse), si l'autocomplétion ne répond pas
  try{ const c=await completeFR(text); if(c.length) return c; }catch(e){}
  const r=await fetch("https://data.geopf.fr/geocodage/search?index=address&limit=6&q="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.features||[]).map(featToPlace);
}
async function reverseFR(lat, lon){
  const r=await fetch(`https://data.geopf.fr/geocodage/reverse?index=address&limit=1&lat=${lat}&lon=${lon}`);
  if(!r.ok) throw new Error(r.status);
  const f=(await r.json()).features?.[0];
  return f ? featToPlace(f) : {name:"Ma position", ctx:"", lat, lon};
}
function useMyPosition(){
  const res=document.getElementById("res");
  if(!navigator.geolocation){ res.innerHTML=`<p class="err">Ton téléphone ne donne pas accès à la position ici.</p>`; return; }
  res.innerHTML=`<p class="hint">Localisation…</p>`;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat, longitude:lon}=pos.coords;
    let place; try{ place=await reverseFR(lat,lon); }catch(e){ place={name:"Ma position", ctx:"", lat, lon}; }
    if(!state.draft) return;
    state.draft.points.push(place); render();
  }, err=>{
    res.innerHTML=`<p class="err">${err.code===1?"Position refusée. Autorise la localisation pour Safari dans Réglages › Confidentialité › Service de localisation.":"Position introuvable. Tape l'adresse à la place."}</p>`;
  }, {enableHighAccuracy:true, timeout:10000});
}
async function searchWorld(text){
  // Open-Meteo : villes du monde entier (utile pour les road trips hors de France)
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=fr&format=json&name="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.results||[]).filter(x=>x.country_code!=="FR").map(x=>({name:x.name, ctx:[x.admin1,x.country].filter(Boolean).join(", "), lat:x.latitude, lon:x.longitude}));
}
let searchSeq=0;
async function search(text){
  const res=document.getElementById("res"); if(!res) return; const seq=++searchSeq;
  res.innerHTML=`<p class="hint">Recherche…</p>`;
  const [fr,world]=await Promise.allSettled([searchFR(text),searchWorld(text)]);
  if(!document.getElementById("res") || seq!==searchSeq) return;
  const list=[...(fr.value||[]),...(world.value||[])].slice(0,8);
  if(fr.status==="rejected" && world.status==="rejected"){res.innerHTML=`<p class="err">Recherche impossible. Vérifie ta connexion internet puis réessaie.</p>`;return;}
  if(!list.length){res.innerHTML=`<p class="hint">Aucun lieu trouvé pour « ${esc(text)} ». Vérifie l'orthographe ou ajoute la ville.</p>`;return;}
  res.innerHTML=`<div class="results">${list.map((x,i)=>`<button data-pick="${i}">${esc(x.name)}<small>${esc(x.ctx)}</small></button>`).join("")}</div>`;
  res.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    state.draft.points.push(list[+b.dataset.pick]);
    render(); const nq=document.getElementById("q"); if(nq) nq.focus();
  });
}

function saveDraft(){
  const d=state.draft;
  if(d.points.length<2){toast("Ajoute au moins un départ et une arrivée");return;}
  if(state.dayCtx){
    const v=state.vdraft, i=state.dayCtx.i;
    if(i>=0) v.days[i]=d; else v.days.push(d);
    v.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    upsertVoyage(v);
    leaveDay("Journée enregistrée");
    return;
  }
  if(!d.name.trim()) d.name=d.points[0].name+(d.retour.on?" ↔ ":" → ")+d.points.at(-1).name;
  if(d.isDefault) state.routes.forEach(r=>{ if(r.id!==d.id) r.isDefault=false; });
  const i=state.routes.findIndex(r=>r.id===d.id);
  if(i>=0) state.routes[i]=d; else state.routes.push(d);
  if(save()){state.draft=null;openDetail(d.id);toast("Itinéraire enregistré");}
}

  ["Veste 3 en 1","Haut",-3,35,true,false,DEFAULT_MODES()],["Pantalon 3 en 1","Bas",-3,32,true,false,DEFAULT_MODES()]
];
function loadGear(){ try{ const g=JSON.parse(localStorage.getItem(GEAR_KEY)); if(Array.isArray(g)) return g; }catch(e){} return []; }

const gearFrom = p => syncModes({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:p[0], cat:p[1], tMin:p[2], tMax:p[3], waterproof:p[4], heated:p[5], note:"", ...(p[6]?{modes:p[6]}:{})});
const tempRange = g => `${g.tMin} à ${g.tMax} °C`;
// le résumé de l'équipement suit ses configurations
function syncModes(g){
  if(Array.isArray(g.modes) && g.modes.length){
    g.tMin=Math.min(...g.modes.map(m=>m.tMin)); g.tMax=Math.max(...g.modes.map(m=>m.tMax)); g.waterproof=g.modes.some(m=>m.waterproof);
  } else delete g.modes;
  return g;
}

            <button class="gear" data-gear="${esc(g.id)}">
              <span class="gear-name">${esc(g.name)}</span>
              ${g.modes?`<span class="chips">${g.modes.map(m=>`<span class="chip">${esc(m.name)} · ${m.tMin} à ${m.tMax} °C${m.waterproof?" · étanche":""}</span>`).join("")}</span>`
                :`<span class="chips"><span class="chip">${esc(tempRange(g))}</span>${g.waterproof?'<span class="chip">Étanche</span>':""}${g.heated?'<span class="chip accent">Chauffant</span>':""}</span>`}
              ${g.note?`<small class="hint">${esc(g.note)}</small>`:""}
            </button>`).join("")}</div></div>`).join("")
      : `<p class="hint">Ajoute ce que tu as dans ton placard moto. L'appli s'en servira pour te dire quoi mettre selon la météo du trajet.</p>`}
      ${presets.length?`<div class="panel"><h3>Ajout rapide</h3>
        <p class="hint">Touche un équipement que tu possèdes. Tu pourras ajuster ses réglages ensuite.</p>
        <div class="presets">${presets.map(p=>`<button class="preset" data-preset="${esc(p[0])}">+ ${esc(p[0])}</button>`).join("")}</div></div>`:""}
    </div>
    <button class="btn btn-primary fab" id="newgear">+ Autre équipement</button>
    ${tabsBar()}`;
  bindTabs();
  app.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>openGear(b.dataset.gear));
  app.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    const p=PRESETS.find(x=>x[0]===b.dataset.preset); state.gear.push(gearFrom(p)); saveGear(); render(); toast("Ajouté : "+p[0]);
  });
  document.getElementById("newgear").onclick=()=>openGear(null);
}
function openGear(id){
  const src=id?state.gear.find(g=>g.id===id):null;
  state.gearDraft = src ? JSON.parse(JSON.stringify(src)) : gearFrom(["","Haut",5,20,false,false]);
  state.gearNew=!src; state.confirmDelete=false; state.view="gear-edit"; render(); window.scrollTo(0,0);
}
function renderGearEdit(){
  const g=state.gearDraft, modular=Array.isArray(g.modes);
  app.innerHTML = `
    <header class="top">
      <button class="icon-btn" id="back" aria-label="Retour">←</button>
      <div class="eyebrow">${state.gearNew?"Nouvel équipement":"Modifier l'équipement"}</div>
      <span style="width:40px"></span>
    </header>
    <div class="stack">
      <div class="field"><label for="g-name">Nom</label><input type="text" id="g-name" value="${esc(g.name)}" maxlength="50" placeholder="Ex. : Gants Rev'It hiver"></div>
      <div class="field"><label for="g-cat">Catégorie</label>
        <select id="g-cat">${CATS.map(c=>`<option ${c===g.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="panel">
        <h3>Confort</h3>
        <label class="switch"><input type="checkbox" id="g-mod" ${modular?"checked":""}> Modulable (3 en 1, doublures amovibles)</label>
        ${modular?`
          <p class="hint">Une ligne par façon de la porter, avec les températures où tu es bien en roulant. L'appli choisit la bonne selon la météo.</p>
          <div class="mode-head"><span>Configuration</span><span>Mini °C</span><span>Maxi °C</span><span>Étanche</span><span></span></div>
          <div class="modes">${g.modes.map((m,i)=>`<div class="mode">
            <input type="text" id="gm-n-${i}" value="${esc(m.name)}" maxlength="30" aria-label="Nom de la configuration">
            <input type="number" inputmode="numeric" id="gm-a-${i}" value="${m.tMin}" aria-label="Mini">
            <input type="number" inputmode="numeric" id="gm-b-${i}" value="${m.tMax}" aria-label="Maxi">
            <label><input type="checkbox" id="gm-w-${i}" ${m.waterproof?"checked":""}></label>
            <button class="icon-btn" data-rmmode="${i}" aria-label="Retirer cette configuration">✕</button></div>`).join("")}</div>
          <button class="btn btn-ghost" id="g-addmode">+ Ajouter une configuration</button>`
        :`
          <p class="hint">Températures entre lesquelles tu es bien avec cet équipement, en roulant.</p>
          <div class="row2">
            <div class="field"><label for="g-min">Mini (°C)</label><input type="number" inputmode="numeric" id="g-min" value="${g.tMin}" min="-30" max="45"></div>
            <div class="field"><label for="g-max">Maxi (°C)</label><input type="number" inputmode="numeric" id="g-max" value="${g.tMax}" min="-30" max="45"></div>
          </div>
          <label class="switch"><input type="checkbox" id="g-wp" ${g.waterproof?"checked":""}> Étanche à la pluie</label>`}
        <label class="switch"><input type="checkbox" id="g-heat" ${g.heated?"checked":""}> Chauffant</label>
      </div>
      <div class="field"><label for="g-note">Note (facultatif)</label><input type="text" id="g-note" value="${esc(g.note)}" maxlength="80" placeholder="Ex. : batterie à recharger"></div>
      <div class="bar">
        <button class="btn btn-primary" id="g-save">Enregistrer</button>
        ${state.gearNew?"":`<button class="btn btn-danger" id="g-del">Supprimer</button>`}
      </div>
      ${state.confirmDelete?`<div class="confirm"><span>Supprimer « ${esc(g.name)} » ?</span>
        <div class="bar"><button class="btn btn-danger" id="g-delyes">Oui, supprimer</button><button class="btn btn-ghost" id="g-delno">Annuler</button></div></div>`:""}
    </div>`;
  const $=id=>document.getElementById(id);
  const read=()=>{
    g.name=$("g-name").value.trim(); g.cat=$("g-cat").value; g.heated=$("g-heat").checked; g.note=$("g-note").value.trim();
    if(Array.isArray(g.modes)) g.modes=g.modes.map((m,i)=>({name:$("gm-n-"+i).value.trim()||`Configuration ${i+1}`, tMin:Number($("gm-a-"+i).value), tMax:Number($("gm-b-"+i).value), waterproof:$("gm-w-"+i).checked}));
    else { g.tMin=Number($("g-min").value); g.tMax=Number($("g-max").value); g.waterproof=$("g-wp").checked; }
  };
  const leave=()=>{ state.gearDraft=null; state.view="list"; state.tab="equipement"; render(); };
  $("back").onclick=leave;
  $("g-mod").onchange=e=>{ read(); if(e.target.checked){ g.modes=g.cat==="Haut"||g.cat==="Bas" ? DEFAULT_MODES() : [{name:"Configuration 1",tMin:g.tMin,tMax:g.tMax,waterproof:!!g.waterproof}]; } else { syncModes(g); delete g.modes; } render(); };
  if($("g-addmode")) $("g-addmode").onclick=()=>{ read(); g.modes.push({name:`Configuration ${g.modes.length+1}`, tMin:5, tMax:20, waterproof:false}); render(); };
  app.querySelectorAll("[data-rmmode]").forEach(b=>b.onclick=()=>{ read(); g.modes.splice(+b.dataset.rmmode,1); if(!g.modes.length){ delete g.modes; } render(); });
  $("g-save").onclick=()=>{
    read();
    if(!g.name){ toast("Donne un nom à cet équipement"); return; }
    const ranges = g.modes || [g];
    if(ranges.some(m=>!Number.isFinite(m.tMin)||!Number.isFinite(m.tMax))){ toast("Indique les températures mini et maxi"); return; }
    ranges.forEach(m=>{ if(m.tMin>m.tMax) [m.tMin,m.tMax]=[m.tMax,m.tMin]; });
    syncModes(g);
    const i=state.gear.findIndex(x=>x.id===g.id); if(i>=0) state.gear[i]=g; else state.gear.push(g);
    if(saveGear()){ leave(); toast("Équipement enregistré"); }
  };
  if($("g-del")) $("g-del").onclick=()=>{ read(); state.confirmDelete=true; render(); };
  if($("g-delyes")) $("g-delyes").onclick=()=>{ state.gear=state.gear.filter(x=>x.id!==g.id); saveGear(); leave(); toast("Équipement supprimé"); };
  if($("g-delno")) $("g-delno").onclick=()=>{ state.confirmDelete=false; render(); };
}

/* ---------- divers ---------- */
let tt;
function toast(msg, action){
  const t=document.getElementById("toast"); t.textContent="";
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  if(action){ const b=document.createElement("button"); b.className="toast-btn"; b.textContent=action.label; b.onclick=()=>{ t.hidden=true; clearTimeout(tt); action.fn(); }; t.appendChild(b); }
  t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, action?6000:2200);
}
/* ---------- glisser vers la gauche pour supprimer ---------- */
const swipeWrap = (id, html) => `<div class="swipe" data-swipe="${esc(id)}"><button class="swipe-del" data-swipedel="${esc(id)}" tabindex="-1">Supprimer</button>${html}</div>`;
function closeSwipes(except){ app.querySelectorAll(".swipe.open").forEach(w=>{ if(w!==except) w.classList.remove("open"); }); }
// renvoie true si le geste était un glissement (le toucher ne doit pas ouvrir la carte)
function swipeGuard(el){ const w=el.closest(".swipe"); if(!w) return false; if(w.dataset.moved==="1"){ w.dataset.moved=""; return true; } if(w.classList.contains("open")){ w.classList.remove("open"); return true; } closeSwipes(); return false; }
function bindSwipes(){
  app.querySelectorAll(".swipe").forEach(w=>{
    const card=w.querySelector(".card"); let x0=0, y0=0, dx=0, drag=false, active=false;
    w.addEventListener("pointerdown",e=>{ if(e.target.closest(".swipe-del")) return; active=true; drag=false; x0=e.clientX; y0=e.clientY; dx=0; });
    w.addEventListener("pointermove",e=>{
      if(!active) return;
      const mx=e.clientX-x0, my=e.clientY-y0;
      if(!drag){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3){ drag=true; closeSwipes(w); w.classList.add("dragging"); } else if(Math.abs(my)>10){ active=false; return; } else return; }
      dx=mx; const base=w.classList.contains("open")?-104:0;
      card.style.transform=`translateX(${Math.max(-140,Math.min(0,base+dx))}px)`;
    });
    const end=()=>{
      if(!active) return; active=false;
      if(!drag) return;
      const base=w.classList.contains("open")?-104:0, pos=base+dx;
      w.classList.remove("dragging"); card.style.transform="";
      w.classList.toggle("open", pos<-52);
      w.dataset.moved="1"; setTimeout(()=>{ w.dataset.moved=""; },350);
    };
    w.addEventListener("pointerup",end); w.addEventListener("pointercancel",end); w.addEventListener("pointerleave",end);
  });
  app.querySelectorAll("[data-swipedel]").forEach(b=>b.onclick=()=>removeRoute(b.dataset.swipedel));
}
function removeRoute(id){
  const i=state.routes.findIndex(r=>r.id===id); if(i<0) return;
  const [gone]=state.routes.splice(i,1); save(); render();
  toast(`« ${gone.name||"Sans nom"} » supprimé`, {label:"Annuler", fn:()=>{ state.routes.splice(Math.min(i,state.routes.length),0,gone); save(); render(); toast("Restauré"); }});
}

const app=document.getElementById("app");
function renderView(){
  if(state.view==="edit") return renderEditor();
  if(state.view==="detail") return renderDetail();
  if(state.view==="gear-edit") return renderGearEdit();
  if(state.view==="voyage") return renderVoyage();
  if(state.view==="voyage-edit") return renderVoyageEditor();
  if(state.view==="loop") return renderLoop();
  if(state.view==="incoming") return renderIncoming();
  return state.tab==="equipement" ? renderGear() : state.tab==="reglages" ? renderRules() : renderList();
}
function render(){
  state.pendingMaps=[];
  try{ renderView(); }
  catch(e){
    console.error(e);
    app.innerHTML=`<header class="top"><h1 class="brand">Roule <span>ou pas</span></h1></header>
      <div class="panel"><h3>Un écran n'a pas pu s'afficher</h3>
      <p class="hint">Tes trajets et ton équipement sont conservés. Reviens à l'accueil ; si le problème revient, envoie ce message à Claude :</p>
      <p class="err">${esc(String(e&&e.message||e))}</p>
      <button class="btn btn-primary" id="err-home">Revenir à l'accueil</button></div>`;
    const b=document.getElementById("err-home");
    if(b) b.onclick=()=>{ state.view="list"; state.tab="trajets"; state.dayCtx=null; state.draft=null; render(); };
    return;
  }
  if(newVersion){ app.insertAdjacentHTML("afterbegin", updateBanner()); bindUpdate(); }
  if(state.view==="list") app.insertAdjacentHTML("beforeend", `<p class="version">Version ${APP_VERSION}</p>`);
  mountMaps();
}
state.rules=loadRules();
render();
refreshPrice();
checkUpdate();
checkIncoming();
window.addEventListener("hashchange",checkIncoming);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
</script>
