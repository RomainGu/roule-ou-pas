<title>Roule ou Pas</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne mobile, trajet par défaut en tête, cartes itinéraire empilées */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#1c2329; --muted:#5b6672; --line:#d4d9de;
  --accent:#f2b705; --accent-ink:#1c2329; --road:#3a444d; --road-ink:#e8ecef; --danger:#b8352a; --warn:#d9822b; --ok:#2f8f5b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14191e; --surface:#1f262d; --ink:#e8ecef; --muted:#94a0ab; --line:#313a43;
  --accent:#f5c518; --accent-ink:#14191e; --road:#2a323a; --road-ink:#e8ecef; --danger:#e0655a; --warn:#f0a050; --ok:#4cc38a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button:disabled{opacity:.35}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 170px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{font:700 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:4px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font:700 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:700 18px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:focus-visible,input:focus-visible,.card:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.stack{display:flex;flex-direction:column;gap:18px}
.list{display:flex;flex-direction:column;gap:12px}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;cursor:pointer;text-align:left;width:100%}
.card.hero{border:2px solid var(--accent)}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font:700 20px/1.1 var(--display);text-transform:uppercase}
.card .path{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legs{display:flex;flex-direction:column;gap:2px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px}
.legs b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
.chip.accent{background:var(--accent);color:var(--accent-ink)}
.chip.todo{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.sketch{width:100%;height:100%;display:block}
.mapbox{position:relative;height:140px;border-radius:8px;overflow:hidden;background:var(--road);isolation:isolate}
.mapbox.big{height:240px}
.card .mapbox{pointer-events:none}
.mapbox .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.mapbox .leaflet-container{width:100%;height:100%;background:var(--road);font:inherit}
.mapbox .leaflet-control-attribution{font-size:9px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted)}
.mapbox .leaflet-control-attribution a{color:var(--muted)}
.mapbox .empty-map{position:absolute;inset:0;display:grid;place-items:center;color:var(--road-ink);opacity:.6;font:700 15px/1.2 var(--display);text-transform:uppercase;text-align:center;padding:12px}
.update{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--accent-ink);padding:10px 12px;border-radius:0 0 10px 10px;font-weight:600}
.update .btn{background:var(--accent-ink);color:var(--accent);padding:8px 12px}
.version{font-size:12px;color:var(--muted);text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tab{border:0;background:transparent;border-radius:10px;padding:10px;font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.gear-list{display:flex;flex-direction:column}
.gear{display:flex;flex-direction:column;gap:6px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.gear:first-child{border-top:0;padding-top:0}
.gear-name{font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--ink)}
input[type=number]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px 22px;font-size:17px}

/* éditeur */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=search],input[type=time]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);background:var(--road);color:var(--road-ink)}
.step.end .dot{background:var(--accent);color:var(--accent-ink)}
.step .txt{min-width:0}
.step .city{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step .acts{display:flex;gap:4px}
.step .acts .icon-btn{width:34px;height:34px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.results button{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:11px 12px;cursor:pointer}
.results button:first-child{border-top:0}
.results small{color:var(--muted);display:block}
.hint{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
.slot{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--bg)}
.slot-out{font-size:14px;font-variant-numeric:tabular-nums}
.slot-out b{font-weight:600}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.summary b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.bar .btn{flex:1 1 140px}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const KEY = "rouleoupas.routes.v1";
const FALLBACK_KMH = 55, FALLBACK_FACTOR = 1.3; // utilisés seulement si le calcul routier échoue

/* ---------- dates ---------- */
const isoDate = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); return isoDate(new Date(y,m-1,d+n)); };
const todayIso = () => isoDate(new Date());
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const fmtDate = (iso, opts) => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("fr-FR", opts||{weekday:"short", day:"numeric", month:"short"}); };

/* ---------- modèle & stockage ---------- */
function defaultRoute(){
  return {id:"maison-boulot", name:"Maison ↔ Boulot", isDefault:true, points:[],
    aller:{start:"07:30", end:"08:00"}, retour:{on:true, start:"17:30", end:"18:00"},
    legs:null, legsKey:"", legsSource:""};
}
const isVoyage = r => !!r && r.kind==="voyage";
// un jour de road trip a la même forme qu'un trajet : points, tronçons, plage de départ (sans retour)
function migrateDay(d){
  if(!d.id) d.id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(!d.date) d.date=addDays(todayIso(),1);
  if(!d.aller) d.aller={start:"09:00",end:"09:00"};
  d.retour={on:false,start:d.aller.start,end:d.aller.end};
  if(!Array.isArray(d.points)) d.points=[];
  if(typeof d.note!=="string") d.note="";
  d.moto=!!d.moto;
  if(!("legs" in d)){ d.legs=null; d.legsKey=""; d.legsSource=""; }
  return d;
}
function migrate(r){
  if(isVoyage(r)){ r.days=(Array.isArray(r.days)?r.days:[]).map(migrateDay); if(typeof r.name!=="string") r.name=""; return r; }
  if(!r.aller){ const d=r.departure||"08:00"; r.aller={start:d,end:d}; }
  if(!r.retour) r.retour={on:false,start:"17:30",end:"18:00"};
  if(!Array.isArray(r.points)) r.points=[];
  delete r.departure; delete r.speed;
  if(!("legs" in r)){ r.legs=null; r.legsKey=""; r.legsSource=""; }
  return r;
}
function load(){
  let routes=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) routes=JSON.parse(raw); }catch(e){}
  routes=(Array.isArray(routes)?routes:[]).filter(r=>r && !r.example).map(migrate);
  if(!routes.length) routes.push(defaultRoute());
  return routes;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.routes)); return true; }
  catch(e){ toast("Enregistrement impossible : mémoire du téléphone pleine"); return false; }
}
const state = { rules:{}, pendingMaps:[], tab:"trajets", gear:[], routes: load(), view:"list", draft:null, confirmDelete:false, routing:false, routingErr:false };
save();
try{ const g=JSON.parse(localStorage.getItem("rouleoupas.gear.v1")); if(Array.isArray(g)) state.gear=g; }catch(e){}
const editing = () => ["edit","gear-edit","voyage-edit"].includes(state.view) || (state.view==="loop" && document.activeElement && document.activeElement.id==="q");

/* ---------- temps ---------- */
const toMin = s => { const [h,m]=(s||"00:00").split(":").map(Number); return h*60+m; };
const fmtTime = min => { const t=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); };
const fmtDur = min => { const r=Math.round(min); const h=Math.floor(r/60), m=r%60; return h? `${h} h ${String(m).padStart(2,"0")}` : `${m} min`; };
const fmtKm = km => (km<10? km.toFixed(1).replace(".",",") : Math.round(km).toLocaleString("fr-FR"))+" km";
const fmtSlot = (a,b) => a===b ? fmtTime(a) : `${fmtTime(a)}–${fmtTime(b)}`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- calcul routier ---------- */
// clé d'un itinéraire : coordonnées (+ durée de ferry quand une étape s'atteint en bateau)
const keyOf = pts => pts.map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5)+(p.ferry>0?"f"+p.ferry:"")).join(";");
// clé de calcul d'un trajet : ses points + le mode « routes moto » (sans autoroute) quand il est actif
const rkey = r => keyOf(r.points)+(r.moto?"|moto":"");
function haversine(a,b){
  const R=6371, t=x=>x*Math.PI/180, dLat=t(b.lat-a.lat), dLon=t(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function ferryLeg(a,b){ return {km:haversine(a,b), min:b.ferry, ferry:true}; }
function estimateLegs(pts){
  return pts.slice(1).map((p,i)=>{ if(p.ferry>0) return ferryLeg(pts[i],p); const km=haversine(pts[i],p)*FALLBACK_FACTOR; return {km, min:km/FALLBACK_KMH*60}; });
}
async function osrm(pts){
  const coords=pts.map(p=>p.lon+","+p.lat).join(";");
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`);
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); if(d.code!=="Ok"||!d.routes?.length) throw new Error(d.code);
  return {legs:d.routes[0].legs.map(l=>({km:l.distance/1000, min:l.duration/60})), geom:thin(d.routes[0].geometry.coordinates)};
}
// polyline Valhalla (précision 6) → [[lon,lat], …]
function decode6(str){
  let i=0, lat=0, lon=0; const out=[];
  const next=()=>{ let b, shift=0, res=0; do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20); return (res&1)?~(res>>1):(res>>1); };
  while(i<str.length){ lat+=next(); lon+=next(); out.push([lon/1e6, lat/1e6]); }
  return out;
}
// Valhalla, profil moto : évite autoroutes et péages, préfère les routes secondaires
async function valhalla(pts){
  const q={locations:pts.map(p=>({lat:+p.lat.toFixed(6), lon:+p.lon.toFixed(6), type:"break"})), costing:"motorcycle",
    costing_options:{motorcycle:{use_highways:0, use_tolls:0.2, use_trails:0}}, directions_type:"none", units:"kilometers"};
  const r=await fetch("https://valhalla1.openstreetmap.de/route?json="+encodeURIComponent(JSON.stringify(q)));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); if(!d.trip || d.trip.status!==0) throw new Error("valhalla");
  const coords=[]; d.trip.legs.forEach(l=>coords.push(...decode6(l.shape)));
  return {legs:d.trip.legs.map(l=>({km:l.summary.length, min:l.summary.time/60})), geom:thin(coords)};
}
// la route est calculée par morceaux ; une traversée en ferry est une ligne droite de la durée saisie
async function fetchLegs(pts, moto){
  const legs=new Array(Math.max(0,pts.length-1)), geom=[];
  let from=0, engine=moto?"valhalla":"osrm";
  const calc=async seg=>{ if(engine==="valhalla"){ try{ return await valhalla(seg); }catch(e){ engine="osrm"; } } return osrm(seg); };
  const road=async(a,b)=>{ if(b<=a) return; const r=await calc(pts.slice(a,b+1)); r.legs.forEach((l,i)=>legs[a+i]=l); geom.push(...r.geom); };
  for(let i=1;i<pts.length;i++){
    if(pts[i].ferry>0){
      await road(from,i-1);
      legs[i-1]=ferryLeg(pts[i-1],pts[i]);
      geom.push([+pts[i-1].lat.toFixed(5),+pts[i-1].lon.toFixed(5)],[+pts[i].lat.toFixed(5),+pts[i].lon.toFixed(5)]);
      from=i;
    }
  }
  await road(from,pts.length-1);
  return {legs, geom, engine};
}
// tronçons pour un ordre de points ; le retour réutilise les tronçons de l'aller, inversés
function legsFor(route, reverse){
  let legs=route.legs && route.legsKey===rkey(route) ? route.legs : estimateLegs(route.points);
  return reverse ? legs.slice().reverse() : legs;
}
// heures de passage ; une pause est ajoutée à chaque tranche de route prévue dans les réglages
function timeline(route, reverse, startMin){
  const pts = reverse ? route.points.slice().reverse() : route.points;
  const legs = legsFor(route, reverse);
  const every = state.rules.pauseEvery>0 ? state.rules.pauseEvery : 0, len = state.rules.pauseLen>0 ? state.rules.pauseLen : 0;
  const stopsBefore = drive => every&&len ? Math.max(0, Math.ceil(drive/every)-1) : 0;
  let km=0, m=startMin, drive=0, pauses=0; const out=[{pt:pts[0],km:0,min:m,pauses:0}];
  legs.forEach((l,i)=>{
    const n=l.ferry ? 0 : stopsBefore(drive+l.min)-stopsBefore(drive); // pas de pause comptée en ferry
    if(!l.ferry) drive+=l.min;
    km+=l.km; pauses+=n; m+=l.min+n*len;
    out.push({pt:pts[i+1],km,min:m,pauses});
  });
  return out;
}
const totals = route => { const l=legsFor(route,false); return {km:l.reduce((s,x)=>s+x.km,0), min:l.reduce((s,x)=>s+x.min,0)}; };
const isEstimate = route => !(route.legs && route.legsKey===rkey(route) && (route.legsSource==="osrm"||route.legsSource==="valhalla"));

async function ensureRouting(){
  const d=state.draft; if(!d || d.points.length<2) return;
  const k=rkey(d);
  if(d.legsKey===k && !isEstimate(d) && d.geomKey===k) return;
  if(state.routing===k) return;
  state.routing=k; state.routingErr=false;
  try{
    const res=await fetchLegs(d.points, d.moto);
    if(state.draft!==d || rkey(d)!==k) return;
    d.legs=res.legs; d.geom=res.geom; d.geomKey=k; d.legsKey=k; d.legsSource=res.engine;
  }catch(e){
    if(state.draft===d){ d.legs=estimateLegs(d.points); d.legsKey=k; d.legsSource="estimate"; state.routingErr=true; }
  }finally{ if(state.routing===k) state.routing=false; if(state.view==="edit") render(); }
}

// allège le tracé : points arrondis à ~1 m, en sautant ceux à moins de ~60 m du précédent
function thin(coords){
  const out=[]; let last=null;
  for(const [lon,lat] of coords){
    if(last && Math.abs(lat-last[0])<0.00055 && Math.abs(lon-last[1])<0.0009) continue;
    last=[+lat.toFixed(5), +lon.toFixed(5)]; out.push(last);
  }
  const end=coords.at(-1); if(end) out.push([+end[1].toFixed(5), +end[0].toFixed(5)]);
  return out;
}
// complète le tracé des itinéraires déjà enregistrés qui n'en ont pas encore
const geomPending={};
async function ensureGeom(route){
  if(!ready(route) || (route.geom && route.geomKey===rkey(route)) || geomPending[route.id]) return;
  geomPending[route.id]=true;
  try{
    const res=await fetchLegs(route.points, route.moto);
    route.legs=res.legs; route.geom=res.geom; route.geomKey=route.legsKey=rkey(route); route.legsSource=res.engine;
    save(); if(!editing()) render();
  }catch(e){} finally{ setTimeout(()=>delete geomPending[route.id], 60000); }
}

/* ---------- carte ---------- */
let liveMaps=[];
const isDark = () => document.documentElement.dataset.theme==="dark" || (document.documentElement.dataset.theme!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
function mapBox(route, mode, marks){
  const id="m"+Math.random().toString(36).slice(2,8);
  if(!ready(route)) return `<div class="mapbox"><div class="empty-map">Ajoute tes étapes<br>pour voir le trajet</div></div>`;
  state.pendingMaps.push({id, route, interactive: mode==="detail", marks: marks||null});
  return `<div class="mapbox${mode==="card"?"":" big"}" id="${id}" aria-label="Carte du trajet"></div>`;
}
function mountMaps(){
  liveMaps.forEach(m=>{ try{m.remove();}catch(e){} }); liveMaps=[];
  const jobs=state.pendingMaps; state.pendingMaps=[];
  jobs.forEach(({id, route, interactive, marks})=>{
    const el=document.getElementById(id); if(!el) return;
    if(!window.L){ el.innerHTML=sketch(route.points); return; } // hors ligne : croquis simple
    const opts=interactive?{zoomControl:true}:{zoomControl:false,dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,keyboard:false,tap:false};
    const map=L.map(el,{...opts, attributionControl:true});
    map.attributionControl.setPrefix(false);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:19, className:isDark()?"tiles-dark":"", attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    const css=getComputedStyle(document.documentElement), tok=(n,f)=>css.getPropertyValue(n).trim()||f;
    const accent=tok("--accent","#f2b705"), ink=tok("--ink","#1c2329"), lvlColor=[tok("--ok","#2f8f5b"),tok("--warn","#d9822b"),tok("--danger","#b8352a")];
    const hasGeom = route.geom && route.geomKey===rkey(route);
    const line = hasGeom ? route.geom : route.points.map(p=>[p.lat,p.lon]);
    L.polyline(line,{color:ink,weight:7,opacity:.35}).addTo(map);
    L.polyline(line,{color:accent,weight:4,opacity:1,dashArray:hasGeom?null:"6 8"}).addTo(map);
    if(marks && marks.length){
      // un point par relevé météo, coloré selon le verdict à cet endroit
      marks.forEach(k=>L.circleMarker([k.lat,k.lon],{radius:k.stop?8:6,color:ink,weight:2,fillColor:lvlColor[k.lvl]||accent,fillOpacity:1}).addTo(map)
        .bindTooltip(k.label,{direction:"top",offset:[0,-6]}));
    } else {
      route.points.forEach((p,i)=>{
        const end=i===0||i===route.points.length-1;
        L.circleMarker([p.lat,p.lon],{radius:end?7:5,color:ink,weight:2,fillColor:end?accent:"#ffffff",fillOpacity:1}).addTo(map)
          .bindTooltip(p.name,{direction:"top",offset:[0,-6]});
      });
    }
    const A=interactive && an.cache[rkey(route)];
    if(A){
      A.stations.forEach(x=>L.circleMarker([x.lat,x.lon],{radius:4,color:ink,weight:1.5,fillColor:"#ffffff",fillOpacity:1}).addTo(map).bindTooltip("Station · "+x.name,{direction:"top"}));
      A.closures.forEach(x=>L.circleMarker([x.lat,x.lon],{radius:6,color:ink,weight:2,fillColor:lvlColor[2],fillOpacity:1}).addTo(map).bindTooltip(`${x.name} · fermée ${fmtPeriod(x.p)}`,{direction:"top"}));
    }
    map.fitBounds(L.latLngBounds(line),{padding:[18,18]});
    liveMaps.push(map);
    if(!hasGeom && !route.composite) ensureGeom(route);
  });
}

const APP_VERSION="2026.10.06-10";
// compare deux versions « AAAA.MM.JJ-N » : positif si a est plus récente que b
const cmpVer=(a,b)=>{ const p=v=>v.split(/[.-]/).map(Number); const x=p(a), y=p(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };

  }catch(e){}
}

/* ---------- croquis du tracé ---------- */
function sketch(points, size=84){
  if(points.length<2) return `<svg class="sketch" viewBox="0 0 ${size} ${size}" aria-hidden="true"><text x="50%" y="54%" text-anchor="middle" font-size="26" fill="var(--road-ink)" opacity=".5">?</text></svg>`;
  const xs=points.map(p=>p.lon*Math.cos(p.lat*Math.PI/180)), ys=points.map(p=>-p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY)||1, pad=14, s=(size-pad*2)/span;
  const ox=(size-(maxX-minX)*s)/2, oy=(size-(maxY-minY)*s)/2;
  const pts=points.map((p,i)=>[ox+(xs[i]-minX)*s, oy+(ys[i]-minY)*s]);
  const d=pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
  const dots=pts.map((p,i)=>{const end=i===0||i===pts.length-1;return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${end?4.5:3}" fill="${end?'var(--accent)':'var(--road-ink)'}"/>`;}).join("");
  return `<svg class="sketch" viewBox="0 0 ${size} ${size}" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- météo ---------- */
const WX_KEY="rouleoupas.wx.v2", WX_TTL=30*60*1000, WX_RETRY=60*1000, HORIZON=15;
const wx={cache:{}, pending:{}, err:{}};
try{ localStorage.removeItem("rouleoupas.wx.v1"); }catch(e){}
try{ wx.cache=JSON.parse(localStorage.getItem(WX_KEY))||{}; }catch(e){}
const ready = r => !!r && Array.isArray(r.points) && r.points.length>=2;
function defaultDay(route){
  // une fois le dernier trajet du jour terminé, on affiche demain
  if(!ready(route)) return todayIso();
  const last=route.retour.on?route.retour:route.aller;
  const end=timeline(route,route.retour.on,toMin(last.end)).at(-1).min;
  return nowMin()>end ? addDays(todayIso(),1) : todayIso();
}
function dayLabel(iso, short){
  const t=todayIso();
  if(iso===t) return "Aujourd'hui";
  if(iso===addDays(t,1)) return "Demain";
  return fmtDate(iso, short?{weekday:"short"}:{weekday:"long",day:"numeric",month:"long"});
}
// points de relevé : les étapes saisies + un point tous les ~20 km (40 points au plus) sur le tracé routier
function routeSamples(route){
  const pts=route.points, legs=legsFor(route,false);
  const cum=[0]; legs.forEach(l=>cum.push(cum.at(-1)+l.km)); const total=cum.at(-1);
  const out=pts.map((p,i)=>({name:p.name, lat:p.lat, lon:p.lon, km:cum[i], stop:true}));
  const g=route.geom;
  if(g && g.length>1 && route.geomKey===rkey(route) && total>0){
    const gc=[0]; for(let i=1;i<g.length;i++) gc.push(gc[i-1]+haversine({lat:g[i-1][0],lon:g[i-1][1]},{lat:g[i][0],lon:g[i][1]}));
    const gTot=gc.at(-1)||1, step=Math.max(20, total/38);
    let j=0;
    for(let km=step; km<total-step*0.5; km+=step){
      if(cum.some(c=>Math.abs(c-km)<step*0.4)) continue;
      const target=km/total*gTot; while(j<gc.length-2 && gc[j+1]<target) j++;
      const f=Math.min(1,Math.max(0,(target-gc[j])/((gc[j+1]-gc[j])||1))), a=g[j], b=g[j+1];
      out.push({name:"", lat:+(a[0]+(b[0]-a[0])*f).toFixed(4), lon:+(a[1]+(b[1]-a[1])*f).toFixed(4), km, stop:false});
    }
  }
  return out.sort((x,y)=>x.km-y.km);
}
// heure de passage à un kilométrage donné, entre deux étapes
function timeAt(tl, km){
  for(let i=1;i<tl.length;i++) if(km<=tl[i].km+1e-6){ const a=tl[i-1], b=tl[i]; const f=(km-a.km)/((b.km-a.km)||1); return a.min+(b.min-a.min)*f; }
  return tl.at(-1).min;
}
async function fetchWx(points, date){
  const lat=points.map(p=>p.lat.toFixed(4)).join(","), lon=points.map(p=>p.lon.toFixed(4)).join(",");
  const vars="temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,visibility";
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&start_date=${date}&end_date=${addDays(date,1)}`);
  if(!r.ok) throw new Error(r.status);
  let d=await r.json(); if(!Array.isArray(d)) d=[d];
  return {hourly:d.map(x=>{ const h=x.hourly||{}; delete h.time; return h; }), elev:d.map(x=>x.elevation)};
}
function saveWx(){
  const t=todayIso();
  for(const k in wx.cache) if(k.split("|")[1]<t) delete wx.cache[k];
  try{ localStorage.setItem(WX_KEY, JSON.stringify(wx.cache)); }catch(e){ try{ localStorage.removeItem(WX_KEY); }catch(_){} }
}
function getWx(route, date, force){
  const t=todayIso();
  if(date<t) return {data:null, past:true};
  if(date>addDays(t,HORIZON)) return {data:null, later:addDays(date,-HORIZON)};
  const S=routeSamples(route), k=keyOf(S)+"|"+date, c=wx.cache[k];
  if(force){ delete wx.err[k]; if(c) c.at=0; }
  const fresh = c && Date.now()-c.at<WX_TTL, recentErr = wx.err[k] && Date.now()-wx.err[k]<WX_RETRY;
  if(!fresh && !wx.pending[k] && !recentErr){
    wx.pending[k]=true;
    fetchWx(S,date)
      .then(res=>{ wx.cache[k]={at:Date.now(), hourly:res.hourly, elev:res.elev}; delete wx.err[k]; saveWx(); })
      .catch(()=>{ wx.err[k]=Date.now(); })
      .finally(()=>{ delete wx.pending[k]; if(!editing()) render(); });
  }
  return {data:c||null, loading:!!wx.pending[k], error:!!wx.err[k], samples:S};
}

const SKY = {0:"Ciel dégagé",1:"Peu nuageux",2:"Éclaircies",3:"Couvert",45:"Brouillard",48:"Brouillard givrant",
  51:"Bruine légère",53:"Bruine",55:"Bruine forte",56:"Bruine verglaçante",57:"Bruine verglaçante forte",
  61:"Pluie faible",63:"Pluie",65:"Pluie forte",66:"Pluie verglaçante",67:"Pluie verglaçante forte",
  71:"Neige faible",73:"Neige",75:"Neige forte",77:"Grains de neige",80:"Averses faibles",81:"Averses",82:"Averses violentes",
  85:"Averses de neige",86:"Fortes averses de neige",95:"Orage",96:"Orage avec grêle",99:"Orage avec forte grêle"};
function skyRank(c){
  if(c>=95) return 10; if([56,57,66,67].includes(c)) return 9; if((c>=71&&c<=77)||c===85||c===86) return 8;
  if(c===48) return 7; if(c===82) return 6.5; if(c>=80) return 6; if(c===65) return 5.5; if(c>=61) return 5;
  if(c>=51) return 4; if(c===45) return 3; return c/3; // 0 à 3 : nébulosité
}
const lo = a => a.length?Math.min(...a):NaN, hi = a => a.length?Math.max(...a):NaN;
const fmtInt = n => Math.round(n).toLocaleString("fr-FR");
// nom lisible d'un point de relevé : l'étape, ou le kilométrage depuis le départ (+ altitude en montagne)
function whereOf(p){
  if(!p) return "";
  const base = p.pt.stop ? p.pt.name : `km ${fmtInt(p.km)}`;
  return base + (Number.isFinite(p.elev) && p.elev>=300 ? ` · ${fmtInt(p.elev)} m` : "");
}
function sampleTrip(route, reverse, slot, data){
  const S=routeSamples(route), total=totals(route).km;
  const a=timeline(route,reverse,toMin(slot.start)), b=timeline(route,reverse,toMin(slot.end));
  const idx=S.map((_,i)=>i); if(reverse) idx.reverse();
  const per=idx.map(i=>{
    const h=data.hourly[i], s=S[i]; if(!h) return null;
    const k = reverse ? total-s.km : s.km;
    const m1=timeAt(a,k), m2=timeAt(b,k);
    const rows=[]; for(let r=Math.max(0,Math.floor(m1/60)); r<=Math.min(47,Math.floor(m2/60)); r++) rows.push(r);
    const pick=key=>rows.map(r=>h[key]?.[r]).filter(v=>v!=null);
    const codes=pick("weather_code");
    return {pt:s, km:k, elev:data.elev?.[i], m1, m2,
      tMin:lo(pick("temperature_2m")), tMax:hi(pick("temperature_2m")), feel:lo(pick("apparent_temperature")),
      rain:hi(pick("precipitation")), prob:hi(pick("precipitation_probability")),
      wind:hi(pick("wind_speed_10m")), gust:hi(pick("wind_gusts_10m")), vis:lo(pick("visibility")),
      code:codes.length?codes.reduce((w,c)=>skyRank(c)>skyRank(w)?c:w):NaN};
  }).filter(Boolean);
  const all=k=>per.map(p=>p[k]).filter(Number.isFinite);
  const best=(k,dir)=>per.filter(p=>Number.isFinite(p[k])).reduce((w,p)=>!w||(dir<0?p[k]<w[k]:p[k]>w[k])?p:w,null);
  const worst=per.reduce((w,p)=>!w||skyRank(p.code)>skyRank(w.code)?p:w,null);
  return {per, end:b.at(-1).min,
    agg:{tMin:lo(all("tMin")), tMax:hi(all("tMax")), feel:lo(all("feel")), rain:hi(all("rain")), prob:hi(all("prob")),
         wind:hi(all("wind")), gust:hi(all("gust")), vis:lo(all("vis")), code:worst?.code,
         many:per.length>2, coldAt:whereOf(best("tMin",-1)), rainAt:whereOf(best("rain",1)), gustAt:whereOf(best("gust",1)),
         visAt:whereOf(best("vis",-1)), altMax:hi(all("elev"))}};
}
const num = (v,suf="") => Number.isFinite(v) ? Math.round(v)+suf : "—";
const mm = v => !Number.isFinite(v) ? "—" : (v<0.05?"0":v.toFixed(1).replace(".",","))+" mm";
const visKm = v => !Number.isFinite(v) ? "—" : v>=10000 ? "10+ km" : (v/1000).toFixed(v<1000?1:0).replace(".",",")+" km";
function wxBlock(label, route, reverse, slot, data, date, detailed){
  const s=sampleTrip(route,reverse,slot,data), g=s.agg;
  const past = date===todayIso() && nowMin()>s.end;
  const v=verdictOf(g), o=outfitOf(g), ride=rideFeel(g.tMin, avgSpeed(route));
  const cells=`<div class="wx-grid">
    <div class="wx-cell"><span>Temp.</span><b>${num(g.tMin,"°")}${Math.round(g.tMax)!==Math.round(g.tMin)&&Number.isFinite(g.tMax)?" / "+num(g.tMax,"°"):""}</b><small>à moto ≈ ${num(ride,"°")}</small></div>
    <div class="wx-cell"><span>Pluie</span><b>${mm(g.rain)}</b><small>${num(g.prob," %")} risque</small></div>
    <div class="wx-cell"><span>Rafales</span><b>${num(g.gust)}</b><small>vent ${num(g.wind)} km/h</small></div>
    <div class="wx-cell"><span>Visib.</span><b>${visKm(g.vis)}</b><small>min.</small></div></div>`;
  const flags=verdictHtml(v,!detailed)+outfitHtml(o,!detailed);
  const alt = detailed && g.many ? `<div class="wx-alt">${Number.isFinite(g.altMax)&&g.altMax>=300?`Altitude max ≈ ${fmtInt(g.altMax)} m · `:""}point le plus froid : ${esc(g.coldAt||"—")}</div>` : "";
  let table="";
  if(detailed){
    const tbl=`<div class="pts"><table><thead><tr><th>Passage</th><th>Temp.</th><th>Pluie</th><th>Rafales</th><th>Ciel</th></tr></thead><tbody>
    ${s.per.map(p=>`<tr><td>${esc(whereOf(p))}<small>${fmtSlot(p.m1,p.m2)}</small></td><td>${num(p.tMin,"°")}<small>${num(p.feel,"°")} ress.</small></td><td>${mm(p.rain)}<small>${num(p.prob," %")}</small></td><td>${num(p.gust)}<small>km/h</small></td><td>${esc(SKY[p.code]??"—")}</td></tr>`).join("")}
    </tbody></table></div>`;
    table = s.per.length>8 ? `<details class="more"><summary>Détail des ${s.per.length} points du trajet</summary>${tbl}</details>` : tbl;
  }
  return `<div class="wx${past?" past":""}">
    <div class="wx-head"><h3>${esc(label)} · ${fmtSlot(toMin(slot.start),toMin(slot.end))}</h3>
      <span class="wx-sky">${past?"Trajet passé · ":""}${esc(SKY[g.code]??"—")}</span></div>
    ${flags}${cells}${alt}${table}</div>`;
}
// points colorés pour la carte
function wxMarks(route, reverse, slot, data){
  return sampleTrip(route,reverse,slot,data).per.map(p=>{
    const v=verdictOf(p);
    return {lat:p.pt.lat, lon:p.pt.lon, stop:p.pt.stop, lvl:v.lvl,
      label:`${whereOf(p)} · ${fmtSlot(p.m1,p.m2)} · ${VERDICT[v.lvl].label}${v.reasons[0]?" : "+v.reasons[0].t:""}`};
  });
}
function wxFoot(w){
  const at=new Date(w.data.at), n=(w.samples||[]).length, along=(w.samples||[]).some(s=>!s.stop);
  return `<p class="hint">Prévisions Open-Meteo de ${fmtTime(at.getHours()*60+at.getMinutes())}${w.loading?" · mise à jour…":""}${w.error?" · mise à jour impossible":""}. ${along?`Météo relevée en ${n} points le long de la route, altitude comprise. `:""}Valeurs les plus défavorables sur ta plage horaire, pluie en mm par heure.</p>`;
}

/* ---------- verdict & tenue ---------- */
const RULES_KEY="rouleoupas.rules.v1";
const DEFAULT_RULES={rainWarn:0.3, rainStop:4, probWarn:60, coldWarn:4, coldStop:1, gustWarn:50, gustStop:75, visWarn:1000, visStop:200, heatWarn:33, rideSpeed:0, pauseEvery:105, pauseLen:15, tank:19, cons:5.5, fuelMargin:50, fuelType:"e10", priceManual:0, curRange:0, curRangeDay:""};
const RULE_FIELDS=[
  ["Pluie", [["rainWarn","Prudence dès","mm/h",0.1],["rainStop","Pas aujourd'hui dès","mm/h",0.5],["probWarn","Prudence si risque d'averse ≥","%",5]]],
  ["Froid (température de l'air)", [["coldWarn","Prudence à","°C ou moins",1],["coldStop","Pas aujourd'hui à","°C ou moins",1]]],
  ["Vent", [["gustWarn","Prudence si rafales ≥","km/h",5],["gustStop","Pas aujourd'hui si rafales ≥","km/h",5]]],
  ["Brouillard", [["visWarn","Prudence si visibilité <","m",100],["visStop","Pas aujourd'hui si visibilité <","m",50]]],
  ["Chaleur", [["heatWarn","Prudence dès","°C",1]]],
  ["Pauses", [["pauseEvery","Une pause toutes les","min de route",15],["pauseLen","Durée d'une pause","min",5]]],
];
const VERDICT=[{label:"Roule",cls:"go"},{label:"Prudence",cls:"warn"},{label:"Pas aujourd'hui",cls:"stop"}];
function verdictOf(g){
  const R=state.rules, out=[]; let lvl=0;
  const add=(l,t)=>{ out.push({l,t}); lvl=Math.max(lvl,l); };
  const fin=Number.isFinite;
  if(g.code>=95) add(2, g.code>=96?"Orage avec grêle":"Orage");
  if([56,57,66,67].includes(g.code)) add(2,"Pluie ou bruine verglaçante");
  if((g.code>=71&&g.code<=77)||g.code===85||g.code===86) add(2,"Neige");
  const at=k=>g.many&&g[k]?` (${g[k]})`:"";
  if(fin(g.tMin)){ if(g.tMin<=R.coldStop) add(2,`${num(g.tMin,"°C")}${at("coldAt")} : risque de verglas`); else if(g.tMin<=R.coldWarn) add(1,`${num(g.tMin,"°C")}${at("coldAt")} : chaussée froide, plaques possibles`); }
  if(fin(g.tMax)&&g.tMax>=R.heatWarn) add(1,`Forte chaleur (${num(g.tMax,"°C")}) : hydrate-toi`);
  if(fin(g.rain)&&g.rain>=R.rainStop) add(2,`Forte pluie (${mm(g.rain)}/h)${at("rainAt")}`);
  else if(fin(g.rain)&&g.rain>=R.rainWarn) add(1,`Pluie (${mm(g.rain)}/h)${at("rainAt")} : route glissante`);
  else if(fin(g.prob)&&g.prob>=R.probWarn) add(1,`Risque d'averse ${num(g.prob," %")}`);
  if(fin(g.gust)&&g.gust>=R.gustStop) add(2,`Rafales à ${num(g.gust)} km/h${at("gustAt")}`);
  else if(fin(g.gust)&&g.gust>=R.gustWarn) add(1,`Rafales à ${num(g.gust)} km/h${at("gustAt")}`);
  if(fin(g.vis)&&g.vis<R.visStop) add(2,`Brouillard épais (${visKm(g.vis)})${at("visAt")}`);
  else if(fin(g.vis)&&g.vis<R.visWarn) add(1,`Brouillard (${visKm(g.vis)})${at("visAt")}`);
  out.sort((a,b)=>b.l-a.l);
  return {lvl, reasons:out};
}
// température ressentie à moto (refroidissement éolien à la vitesse moyenne du trajet)
function rideFeel(t, kmh){
  if(!Number.isFinite(t)) return NaN;
  if(t>15 || kmh<5) return t;
  const v=Math.pow(kmh,0.16);
  return Math.min(t, 13.12+0.6215*t-11.37*v+0.3965*t*v);
}
function avgSpeed(route){
  if(state.rules.rideSpeed>0) return state.rules.rideSpeed;
  const l=legsFor(route,false).filter(x=>!x.ferry), km=l.reduce((s,x)=>s+x.km,0), min=l.reduce((s,x)=>s+x.min,0);
  return min>0 ? km/(min/60) : 50;
}
const ZONES=["Haut","Bas","Mains","Pieds","Tête & cou"];
function outfitOf(g){
  const R=state.rules, gear=state.gear, T=g.tMin, Tx=Number.isFinite(g.tMax)?g.tMax:T;
  const wet=(g.rain>=R.rainWarn)||(g.prob>=R.probWarn);
  if(!gear.length || !Number.isFinite(T)) return {picks:[], wet, empty:!gear.length};
  const covers=(i,t)=>i.tMin<=t && t<=i.tMax;
  const isLayer=i=>/doublure/i.test(i.name);
  const picks=[];
  // une veste modulable (3 en 1) propose une option par configuration
  const options=i=>Array.isArray(i.modes)&&i.modes.length
    ? i.modes.map(m=>({name:`${i.name} — ${m.name}`, tMin:m.tMin, tMax:m.tMax, waterproof:!!m.waterproof, mode:true}))
    : [{name:i.name, tMin:i.tMin, tMax:i.tMax, waterproof:!!i.waterproof, mode:false}];
  ZONES.forEach(z=>{
    const c=gear.filter(i=>i.cat===z && !isLayer(i)).flatMap(options); if(!c.length) return;
    let ok=c.filter(i=>covers(i,T)), note="";
    if(!ok.length){
      if(z==="Tête & cou") return; // accessoire : seulement quand il fait froid
      const dist=i=>T<i.tMin? i.tMin-T : T-i.tMax;
      ok=[c.slice().sort((a,b)=>dist(a)-dist(b))[0]];
      note = T<ok[0].tMin ? "un peu juste pour ce froid" : "un peu chaud";
    }
    const mid=i=>(i.tMin+i.tMax)/2;
    const score=i=>(covers(i,Tx)?2:0)+(wet&&i.waterproof?3:0)-(i.mode&&!wet&&i.waterproof?0.5:0)-Math.abs(T-mid(i))/Math.max(4,i.tMax-i.tMin);
    ok.sort((a,b)=>score(b)-score(a));
    picks.push({zone:z, item:ok[0], note});
  });
  gear.filter(i=>isLayer(i)||i.cat==="Chauffant"||i.cat==="Moto").forEach(i=>{
    if(T<=i.tMax) picks.push({zone:i.cat==="Moto"?"Moto":"En plus", item:i, note:/gant/i.test(i.name)&&picks.some(p=>p.zone==="Mains")?"à la place des gants, à allumer":i.heated?"à allumer":""});
  });
  let missing=[];
  if(wet){
    // pluie : on ne complète que ce qui n'est pas déjà étanche
    const rain=gear.filter(i=>i.cat==="Pluie"), find=re=>rain.find(i=>re.test(i.name));
    const dryZ=z=>{ const p=picks.find(x=>x.zone===z); return !!(p&&p.item.waterproof); };
    const add=i=>{ if(i && !picks.some(p=>p.item===i)) picks.push({zone:"Pluie", item:i, note:""}); return !!i; };
    let top=dryZ("Haut"), bot=dryZ("Bas");
    const combi=find(/combi/i);
    if(!top && !bot && combi){ add(combi); top=bot=true; }
    if(!top) top=add(find(/veste/i)) || add(combi);
    if(!bot) bot=add(find(/pantalon/i)) || add(combi);
    if(!dryZ("Mains")) add(find(/gant/i));
    if(!dryZ("Pieds")) add(find(/botte|chaussure/i));
    rain.filter(i=>!/combi|veste|pantalon|gant|botte|chaussure/i.test(i.name)).forEach(add);
    if(!top) missing.push("le haut"); if(!bot) missing.push("le bas");
  }
  return {picks, wet, empty:false, noRainGear:missing.length>0, missing};
}
function verdictHtml(v, compact){
  const V=VERDICT[v.lvl];
  const why = v.reasons.length ? v.reasons.slice(0, compact?2:9).map(r=>esc(r.t)).join(" · ") : "Conditions sèches et douces";
  return `<div class="verdict ${V.cls}"><b>${V.label}</b><span>${why}</span></div>`;
}
function outfitHtml(o, compact){
  if(o.empty) return `<p class="hint">Ajoute ton matériel dans l'onglet Équipement pour savoir quoi mettre.</p>`;
  if(!o.picks.length) return "";
  const warn = o.noRainGear ? `<p class="err">Pluie prévue : rien d'étanche pour ${o.missing.join(" et ")} dans ton équipement.</p>` : "";
  if(compact) return `<div class="kit-line"><span class="lbl">Tenue</span> ${o.picks.map(p=>esc(p.item.name)).join(" · ")}</div>${warn}`;
  return `<div class="outfit"><div class="lbl">Tenue conseillée</div><ul class="kit">
    ${o.picks.map(p=>`<li><span class="zone">${esc(p.zone)}</span><span>${esc(p.item.name)}${p.note?` <small>${esc(p.note)}</small>`:""}</span></li>`).join("")}
  </ul>${warn}</div>`;
}

const FUELS={e10:{label:"SP95-E10", field:"e10_prix"}, sp95:{label:"SP95", field:"sp95_prix"}, sp98:{label:"SP98", field:"sp98_prix"}, e85:{label:"E85 (bioéthanol)", field:"e85_prix"}};
const PRICE_KEY="rouleoupas.price.v1";
let fuelPrice=null; try{ fuelPrice=JSON.parse(localStorage.getItem(PRICE_KEY)); }catch(e){}
let pricePending=false;
// prix moyen à la pompe (données officielles prix-carburants) autour de la maison, sinon moyenne nationale
async function refreshPrice(force){
  const type=state.rules.fuelType in FUELS ? state.rules.fuelType : "e10";
  if(pricePending) return;
  if(!force && fuelPrice && fuelPrice.type===type && Date.now()-fuelPrice.at<12*3600e3) return;
  pricePending=true;
  const f=FUELS[type].field, base="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";
  const ask=async where=>{ const r=await fetch(`${base}?select=${encodeURIComponent(`avg(${f}) as p, count(${f}) as n`)}&limit=1${where?"&where="+encodeURIComponent(where):""}`); if(!r.ok) throw new Error(r.status); const x=(await r.json()).results?.[0]; return x&&x.p?x:null; };
  try{
    const h=homePoint(); let x=null, where="France";
    if(h){ x=await ask(`distance(geom, geom'POINT(${h.lon.toFixed(4)} ${h.lat.toFixed(4)})', 25km) and ${f} is not null`); where=`autour de ${h.name}`; if(!x||x.n<3){ x=null; where="France"; } }
    if(!x) x=await ask(`${f} is not null`);
    if(x){ fuelPrice={type, price:+x.p.toFixed(3), n:x.n, where, at:Date.now()}; try{ localStorage.setItem(PRICE_KEY, JSON.stringify(fuelPrice)); }catch(e){} }
  }catch(e){}
  finally{ pricePending=false; if(!editing()) render(); }
}
const pricePerL = () => state.rules.priceManual>0 ? state.rules.priceManual : (fuelPrice && fuelPrice.type===state.rules.fuelType ? fuelPrice.price : null);
const fmtEur = v => v>=100 ? Math.round(v).toLocaleString("fr-FR")+" €" : v.toFixed(2).replace(".",",")+" €";
const fmtL = v => (v<10?v.toFixed(1):Math.round(v).toString()).replace(".",",")+" L";
// km parcourus à moto (les traversées en ferry ne consomment rien)
const roadKm = r => ready(r) ? legsFor(r,false).filter(l=>!l.ferry).reduce((s,l)=>s+l.km,0) : 0;
function fuelCost(km){ const L=km*state.rules.cons/100, p=pricePerL(); return {L, eur:p?L*p:null}; }
const costChip = km => { const c=fuelCost(km); return c.eur!=null&&km>0 ? `<span class="chip">≈ ${fmtEur(c.eur)}</span>` : ""; };
const tripKm = r => isVoyage(r) ? r.days.filter(ready).reduce((s,d)=>s+roadKm(d),0) : roadKm(r)*(r.retour&&r.retour.on?2:1);
// autonomie affichée sur la moto, saisie aujourd'hui ou hier : utilisée pour un départ aujourd'hui ou demain
function currentRange(date){
  const R=state.rules, t=todayIso();
  if(!(R.curRange>0) || !R.curRangeDay || R.curRangeDay<addDays(t,-1)) return null;
  return date && date>addDays(t,1) ? null : R.curRange;
}

      : pricePending?"Recherche du prix réel…":"Prix réel indisponible pour le moment : saisis-en un."}

/* ---------- sauvegarde ---------- */
const BACKUP_KEY="rouleoupas.lastbackup.v1";
function lastBackup(){ try{ return localStorage.getItem(BACKUP_KEY); }catch(e){ return null; } }
function markBackup(){ try{ localStorage.setItem(BACKUP_KEY, new Date().toISOString()); }catch(e){} }
function hasUserData(){ return state.gear.length>0 || state.routes.some(r=>isVoyage(r)? r.days.length>0 : ready(r)); }
function needsBackup(){ const l=lastBackup(); return hasUserData() && (!l || Date.now()-new Date(l).getTime()>30*864e5); }
function backupJson(){
  return JSON.stringify({app:"roule-ou-pas", format:1, version:APP_VERSION, exportedAt:new Date().toISOString(),
    routes:state.routes, gear:state.gear, rules:state.rules});
}
async function exportData(){
  const name=`roule-ou-pas-${todayIso()}.json`;
  let file=null;
  try{ file=new File([backupJson()], name, {type:"application/json"}); }catch(e){}
  if(file && navigator.share && navigator.canShare){
    try{
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Sauvegarde Roule ou pas"});
        markBackup(); render(); toast("Sauvegarde exportée"); return;
      }
    }catch(e){ if(e && e.name==="AbortError") return; }
  }
  try{
    const url=URL.createObjectURL(file||new Blob([backupJson()],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    markBackup(); render(); toast("Sauvegarde téléchargée");
  }catch(e){ toast("Export impossible : utilise le copier-coller"); }
}
async function copyData(){
  const txt=backupJson();
  try{ await navigator.clipboard.writeText(txt); markBackup(); render(); toast("Copié : colle-le dans une note ou un e-mail"); }
  catch(e){ const ta=document.getElementById("bk-text"); if(ta){ ta.value=txt; ta.focus(); ta.select(); } toast("Texte sélectionné : copie-le"); }
}
function readBackup(text){
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("Ce texte n'est pas une sauvegarde lisible."); }
  if(!d || d.app!=="roule-ou-pas" || !Array.isArray(d.routes)) throw new Error("Ce fichier ne vient pas de Roule ou pas.");
  return d;
}
function stageImport(text){
  try{ state.importPending=readBackup(text); state.importErr=""; }
  catch(e){ state.importPending=null; state.importErr=e.message; }
  render();
}
function applyImport(){
  const d=state.importPending; if(!d) return;
  state.routes=d.routes.filter(Boolean).map(migrate); if(!state.routes.length) state.routes.push(defaultRoute());
  state.gear=Array.isArray(d.gear)?d.gear:[];
  state.rules={...DEFAULT_RULES, ...(d.rules||{})};
  const ok=save() & saveGear() & saveRules();
  state.importPending=null; state.importErr="";
  render(); toast(ok?"Sauvegarde restaurée":"Restauration incomplète : mémoire pleine");
}

  const last=lastBackup(), imp=state.importPending;
  const nV=imp?imp.routes.filter(isVoyage).length:0, nT=imp?imp.routes.length-nV:0;
  return `<div class="panel"><h3>Sauvegarde</h3>
    <p class="hint">Tes trajets, ton équipement et tes réglages ne sont enregistrés que sur ce téléphone. Exporte-les dans Fichiers ou iCloud Drive pour pouvoir les restaurer après une réinstallation ou sur un autre iPhone.</p>
    <p class="hint"><b>Dernière sauvegarde :</b> ${last?esc(new Date(last).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})):"jamais"}</p>
    <div class="bar"><button class="btn btn-primary" id="bk-export">Exporter mes données</button><label class="btn btn-ghost" for="bk-file">Importer une sauvegarde</label></div>

    ${imp?`<div class="import-box"><b>Restaurer cette sauvegarde ?</b>

      <div class="bar"><button class="btn btn-primary" id="bk-apply">Remplacer mes données</button><button class="btn btn-ghost" id="bk-cancel">Annuler</button></div></div>`:""}
    ${state.importErr?`<p class="err">${esc(state.importErr)}</p>`:""}
    <details class="more"><summary>Autre méthode : copier-coller</summary>
      <div class="col">
        <p class="hint">Copie tes données puis colle-les dans une note ou un e-mail à toi-même. Pour restaurer, colle le texte ci-dessous.</p>
        <button class="btn btn-ghost" id="bk-copy">Copier mes données</button>
        <textarea id="bk-text" placeholder="Colle ici le texte d'une sauvegarde" spellcheck="false"></textarea>
        <button class="btn btn-ghost" id="bk-paste">Importer le texte collé</button>
      </div></details>
  </div>`;
}
function bindBackup(){
  const $=id=>document.getElementById(id);
  $("bk-export").onclick=exportData;
  $("bk-copy").onclick=copyData;
  $("bk-paste").onclick=()=>{ const v=$("bk-text").value.trim(); if(!v){ toast("Colle d'abord le texte de la sauvegarde"); return; } stageImport(v); };
  $("bk-file").onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; try{ stageImport(await f.text()); }catch(err){ state.importErr="Lecture du fichier impossible."; render(); } };
  if($("bk-apply")) $("bk-apply").onclick=applyImport;
  if($("bk-cancel")) $("bk-cancel").onclick=()=>{ state.importPending=null; render(); };
}

function renderRules(){
  const R=state.rules;
  app.innerHTML = `
    <header class="top"><h1 class="brand">Roule <span>ou pas</span></h1></header>
    <div class="stack">
      ${backupPanel()}
      <div class="eyebrow">Seuils du verdict</div>
      <p class="hint">Valeurs les plus défavorables sur ta plage horaire et sur tout le trajet. Orage, neige et pluie verglaçante donnent toujours « Pas aujourd'hui ».</p>
      ${RULE_FIELDS.map(([title,fields])=>`<div class="panel"><h3>${esc(title)}</h3>
        ${title==="Pauses"?`<p class="hint">Ajoutées aux heures de passage, pour que la météo corresponde au moment où tu passes vraiment. Mets 0 pour ne pas en compter.</p>`:""}
        ${fields.map(([k,lbl,unit,step])=>`<div class="rule"><label for="r-${k}">${esc(lbl)}</label>
          <span class="rule-in"><input type="number" inputmode="decimal" id="r-${k}" value="${R[k]}" step="${step}"><small>${esc(unit)}</small></span></div>`).join("")}
      </div>`).join("")}
      ${fuelSettingsPanel()}
      <div class="panel"><h3>Ressenti à moto</h3>
        <p class="hint">Vitesse utilisée pour calculer le froid ressenti en roulant. Laisse 0 pour prendre la moyenne de chaque trajet.</p>
        <div class="rule"><label for="r-rideSpeed">Vitesse</label><span class="rule-in"><input type="number" inputmode="numeric" id="r-rideSpeed" value="${R.rideSpeed}" step="10" min="0"><small>km/h</small></span></div>
      </div>
      <div class="bar"><button class="btn btn-primary" id="r-save">Enregistrer les réglages</button><button class="btn btn-ghost" id="r-reset">Valeurs par défaut</button></div>
    </div>
    ${tabsBar()}`;
  bindTabs(); bindBackup();
  const rp=document.getElementById("r-price"); if(rp) rp.onclick=()=>{ refreshPrice(true); render(); };
  document.getElementById("r-save").onclick=()=>{
    const next={...R};
    for(const k of Object.keys(DEFAULT_RULES)){ if(k==="fuelType"||k==="curRangeDay") continue; const el=document.getElementById("r-"+k); if(!el) continue; const v=Number(String(el.value).replace(",",".")); if(el.value!=="" && Number.isFinite(v)) next[k]=v; }
    next.fuelType=document.getElementById("r-fuelType").value;
    const cr=document.getElementById("r-curRange").value, pm=document.getElementById("r-priceManual").value;
    if(cr===""){ next.curRange=0; next.curRangeDay=""; } else if(+cr!==R.curRange || !R.curRangeDay){ next.curRangeDay=todayIso(); }
    if(pm==="") next.priceManual=0;
    if(next.rainStop<next.rainWarn || next.gustStop<next.gustWarn || next.coldStop>next.coldWarn || next.visStop>next.visWarn){ toast("Le seuil « Pas aujourd'hui » doit être plus sévère que « Prudence »"); return; }
    if(next.pauseEvery>0 && next.pauseEvery<30){ toast("Mets au moins 30 min entre deux pauses, ou 0"); return; }
    if(!(next.tank>0) || !(next.cons>0)){ toast("Indique la taille du réservoir et la consommation"); return; }
    const typeChanged=next.fuelType!==R.fuelType;
    state.rules=next; if(saveRules()){ toast("Réglages enregistrés"); if(typeChanged) refreshPrice(true); render(); }
  };
  document.getElementById("r-reset").onclick=()=>{ state.rules={...DEFAULT_RULES}; saveRules(); render(); toast("Valeurs par défaut rétablies"); };
}

/* ---------- vue liste ---------- */
function slotLine(label, route, reverse, slot){
  const s=toMin(slot.start), e=toMin(slot.end);
  if(!ready(route)) return `<span><b>${label}</b> départ ${fmtSlot(s,e)}</span>`;
  const a=timeline(route,reverse,s), b=timeline(route,reverse,e);
  return `<span><b>${label}</b> ${fmtSlot(s,e)} → arrivée ${fmtSlot(a.at(-1).min,b.at(-1).min)}</span>`;
}
function heroWx(route){
  if(!ready(route)) return "";
  const day=defaultDay(route), w=getWx(route,day);
  let body;
  if(w.data) body=wxBlock("Aller",route,false,route.aller,w.data,day,false)+(route.retour.on?wxBlock("Retour",route,true,route.retour,w.data,day,false):"");
  else body=`<p class="${w.error?"err":"hint"}">${w.error?"Météo indisponible. Vérifie ta connexion.":"Chargement de la météo…"}</p>`;
  return `<div class="wx"><div class="eyebrow">Météo · ${esc(dayLabel(day))}</div>${body}</div>`;
}
function cardHtml(route){
  const t=ready(route)?totals(route):null;
  const path = route.points.length ? route.points.map(x=>x.name).join(" → ") : "Ajoute tes adresses";
  return `<button class="card${route.isDefault?" hero":""}" data-open="${esc(route.id)}">
    ${mapBox(route,"card")}
    <div class="meta">
      <div class="name">${esc(route.name||"Sans nom")}</div>
      <div class="path">${esc(path)}</div>
      <div class="legs">
        ${slotLine("Aller",route,false,route.aller)}
        ${route.retour.on?slotLine("Retour",route,true,route.retour):""}
      </div>
      <div class="chips">
        ${route.isDefault?'<span class="chip accent">Par défaut</span>':''}
        ${t?`<span class="chip">${fmtKm(t.km)}</span><span class="chip">${isEstimate(route)?"≈ ":""}${fmtDur(t.min)}</span>${costChip(tripKm(route))}`:'<span class="chip todo">À compléter</span>'}
      </div>
    </div>
    ${route.isDefault?heroWx(route):""}</button>`;
}

/* ---------- road trips : outils ---------- */
function newDay(prev){
  return migrateDay({date: prev ? addDays(prev.date,1) : addDays(todayIso(),1),
    aller:{start:prev?prev.aller.start:"09:00", end:prev?prev.aller.end:"09:00"},

/* ---------- carburant, ferries, routes fermées ---------- */
const AN_KEY="rouleoupas.analysis.v2";
const an={cache:{}, pending:{}, err:{}};
try{ an.cache=JSON.parse(localStorage.getItem(AN_KEY))||{}; }catch(e){}
function saveAn(){
  const keys=Object.keys(an.cache);
  if(keys.length>40) keys.sort((a,b)=>an.cache[a].at-an.cache[b].at).slice(0,keys.length-40).forEach(k=>delete an.cache[k]);
  try{ localStorage.setItem(AN_KEY, JSON.stringify(an.cache)); }catch(e){}
}
const hasGeom = r => !!(r.geom && r.geom.length>1 && r.geomKey===rkey(r));
function geomCum(g){ const c=[0]; for(let i=1;i<g.length;i++) c.push(c[i-1]+haversine({lat:g[i-1][0],lon:g[i-1][1]},{lat:g[i][0],lon:g[i][1]})); return c; }
function lineOf(g, c, stepKm, max){
  const st=Math.max(stepKm, c.at(-1)/max), out=[g[0]]; let nx=st;
  for(let i=1;i<g.length;i++) if(c[i]>=nx){ out.push(g[i]); nx=c[i]+st; }
  out.push(g.at(-1));
  return out.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(",");
}
// position (km le long du tracé) du point du tracé le plus proche
function kmOn(g, c, lat, lon, withDist){
  const k=Math.cos(lat*Math.PI/180); let bi=0, bd=1e9;
  for(let i=0;i<g.length;i++){ const d=(g[i][0]-lat)**2+((g[i][1]-lon)*k)**2; if(d<bd){ bd=d; bi=i; } }
  return withDist ? {km:c[bi], dist:Math.sqrt(bd)*111.32} : c[bi];
}
const periodDays = p => ((p.b*31+p.bd)-(p.a*31+p.ad)+372)%372;
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
// « no @ (Nov 1 - Apr 30) », « no @ Dec-May » → période de fermeture
function closedPeriod(cond){
  const m=String(cond).match(/no\s*@\s*\(?\s*([A-Za-z]{3})[a-z]*\.?\s*(\d{1,2})?\s*-\s*([A-Za-z]{3})[a-z]*\.?\s*(\d{1,2})?/i);
  if(!m) return null;
  const a=MONTHS[m[1].toLowerCase()], b=MONTHS[m[3].toLowerCase()];
  return a==null||b==null ? null : {a, ad:+m[2]||1, b, bd:+m[4]||31};
}
function isClosedOn(p, iso){
  const [,mo,d]=iso.split("-").map(Number), v=(mo-1)*100+d, s0=p.a*100+p.ad, e0=p.b*100+p.bd;
  return s0<=e0 ? (v>=s0&&v<=e0) : (v>=s0||v<=e0);
}
const fmtPeriod = p => p.ad===1&&p.bd===31 ? `de ${MOIS[p.a]} à ${MOIS[p.b]}` : `du ${p.ad} ${MOIS[p.a]} au ${p.bd} ${MOIS[p.b]}`;
const nameScore = n => /vegen|veien|vägen|route|road|strasse|straße|strada|col |pass|fjell/i.test(n) ? 3 : /^\d+$|^[A-Z]{1,2}\d/.test(n) ? 2 : /bru|brua|bridge|pont|tunnel/i.test(n) ? 0 : 1;
async function fetchAnalysis(route){
  const g=route.geom, c=geomCum(g);
  const fine=lineOf(g,c,0.4,1200), coarse=lineOf(g,c,3,300);
  const q=`[out:json][timeout:120];(nwr["amenity"="fuel"](around:1500,${coarse});way["highway"][~"^(motor_vehicle|motorcar|motorcycle|access|vehicle):conditional$"~"no"](around:120,${fine}););out center tags;`;
  const els=(await overpass(q)).elements||[], stations=[], raw=[];
  for(const e of els){
    const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon, t=e.tags||{}; if(lat==null) continue;
    const km=+kmOn(g,c,lat,lon).toFixed(1);
    if(t.amenity==="fuel"){ stations.push({km, name:(t.brand||t.name||"Station").slice(0,40), lat:+lat.toFixed(5), lon:+lon.toFixed(5)}); continue; }
    const cond=t["motorcycle:conditional"]||t["motor_vehicle:conditional"]||t["motorcar:conditional"]||t["vehicle:conditional"]||t["access:conditional"]||"";
    const p=closedPeriod(cond); if(!p) continue;
    // une route voisine qui ne fait que croiser le trajet a son centre loin du tracé : on l'ignore
    if(kmOn(g,c,lat,lon,true).dist>2) continue;
    raw.push({km, name:(t.name||t.ref||"Route de montagne").slice(0,50), p, lat:+lat.toFixed(5), lon:+lon.toFixed(5)});
  }
  // un même col apparaît en plusieurs tronçons (et ponts) : on garde un nom par période et par zone
  raw.sort((a,b)=>a.km-b.km);
  const closures=[];
  for(const x of raw){
    // même route, ou fermetures à moins de 25 km (un col, ses ponts, ses accès) : une seule alerte, avec la période la plus longue
    const same=closures.find(y=>(y.name===x.name && Math.abs(y.km-x.km)<80) || Math.abs(y.km-x.km)<25);
    if(!same){ closures.push(x); continue; }
    const longer=periodDays(x.p)-periodDays(same.p);
    if(longer>0 || (longer===0 && nameScore(x.name)>nameScore(same.name))) Object.assign(same,{name:x.name, p:x.p, km:x.km, lat:x.lat, lon:x.lon});
  }
  const seen=new Set(), st=stations.sort((a,b)=>a.km-b.km).filter(x=>{ const k=x.name+"|"+Math.round(x.km*2); if(seen.has(k)) return false; seen.add(k); return true; });
  return {at:Date.now(), stations:st, closures};
}
function getAnalysis(route){
  if(!ready(route) || !hasGeom(route)) return {data:null, waitGeom:true};
  const k=rkey(route), c=an.cache[k];
  if(!c && !an.pending[k] && !(an.err[k] && Date.now()-an.err[k]<120000)){
    an.pending[k]=true;
    fetchAnalysis(route)
      .then(res=>{ an.cache[k]=res; delete an.err[k]; saveAn(); })
      .catch(()=>{ an.err[k]=Date.now(); })
      .finally(()=>{ delete an.pending[k]; if(!editing()) render(); });
  }
  return {data:c||null, loading:!!an.pending[k], error:!!an.err[k]};
}
const autonomy = () => Math.max(20, state.rules.tank/state.rules.cons*100 - state.rules.fuelMargin);
function fuelPlan(route, data, startRange){
  const g=route.geom, c=geomCum(g), pts=route.points;
  const ferries=legsFor(route,false).map((l,i)=>l.ferry?[kmOn(g,c,pts[i].lat,pts[i].lon), kmOn(g,c,pts[i+1].lat,pts[i+1].lon)].sort((a,b)=>a-b):null).filter(Boolean);
  const road = k => k - ferries.reduce((s,[a,b])=>s+Math.max(0,Math.min(k,b)-a),0);
  const total=road(c.at(-1)), A=autonomy();
  const st=data.stations.map(x=>({...x, rk:road(x.km)})).sort((a,b)=>a.rk-b.rk);
  const marks=[0,...st.map(x=>x.rk),total]; let gap={len:0,from:0,to:0};
  for(let i=1;i<marks.length;i++) if(marks[i]-marks[i-1]>gap.len) gap={len:marks[i]-marks[i-1], from:marks[i-1], to:marks[i]};
  const R0 = startRange>0 ? Math.max(0, startRange-state.rules.fuelMargin) : A;
  const stops=[]; let pos=0, range=R0, stuck=false;
  while(total-pos>range){
    const reach=st.filter(x=>x.rk>pos+(pos?5:0) && x.rk<=pos+range);
    if(!reach.length){ stuck=true; break; }
    const pick=reach.at(-1); stops.push(pick); pos=pick.rk; range=A;
  }
  return {total, A, R0, stops, gap, stuck, count:st.length, fromCurrent:startRange>0};
}
function infoPanels(route, date, startMin, opts={}){
  if(!ready(route)) return "";
  const cur = opts.first===false ? null : currentRange(date);
  const km1=roadKm(route), kmAll=km1*(opts.roundTrip?2:1), cost=fuelCost(kmAll), p=pricePerL();
  const costLine = `<p><b>Carburant ≈ ${cost.eur!=null?fmtEur(cost.eur):"—"}</b> <span class="hint">· ${fmtL(cost.L)} pour ${fmtInt(kmAll)} km${opts.roundTrip?" (aller-retour)":""}${p?` à ${p.toFixed(2).replace(".",",")} €/L`:" · prix à saisir dans Réglages"}${legsFor(route,false).some(l=>l.ferry)?", ferries non compris":""}</span></p>`;
  const tl=timeline(route,false,startMin), legs=legsFor(route,false);
  const ferries=legs.map((l,i)=>l.ferry?{from:route.points[i], to:route.points[i+1], min:l.min, at:tl[i].min}:null).filter(Boolean);
  const a=getAnalysis(route);
  // carburant
  let fuel;
  if(a.waitGeom) fuel=`<p class="hint">Calcul du tracé en cours…</p>`;
  else if(!a.data && cur && cur-state.rules.fuelMargin<km1) fuel=`<div class="flag">Ton autonomie actuelle (${fmtInt(cur)} km) ne couvre pas ces ${fmtInt(km1)} km : prévois un plein. Recherche des stations…</div>`;
  else if(!a.data) fuel=`<p class="${a.error?"err":"hint"}">${a.error?"Recherche des stations impossible pour le moment.":"Recherche des stations-service le long de la route…"}</p>`;
  else{
    const f=fuelPlan(route,a.data,cur);
    fuel=`<p class="hint">${f.fromCurrent?`Départ avec ${fmtInt(cur)} km d'autonomie (affichée sur la moto), puis ≈ ${fmtInt(f.A)} km par plein`:`Autonomie ≈ ${fmtInt(f.A)} km (${String(state.rules.tank).replace(".",",")} L à ${String(state.rules.cons).replace(".",",")} L/100, marge ${state.rules.fuelMargin} km), départ le plein fait`}. ${f.count} station${f.count>1?"s":""} trouvée${f.count>1?"s":""} à moins de 1,5 km de la route.</p>
      ${f.gap.len>f.A?`<div class="flag">Aucune station sur ${fmtInt(f.gap.len)} km (km ${fmtInt(f.gap.from)} → ${fmtInt(f.gap.to)}) : plus que ton autonomie. Prévois un bidon ou un détour.</div>`
        : f.gap.len>f.A*0.8?`<div class="flag">Plus long trou sans station : ${fmtInt(f.gap.len)} km (km ${fmtInt(f.gap.from)} → ${fmtInt(f.gap.to)}). Ne laisse pas passer le plein d'avant.</div>`:""}
      ${f.total<=f.R0?`<p><b>Pas besoin de plein</b> sur ces ${fmtInt(f.total)} km${opts.roundTrip&&f.total*2>f.R0?" (mais l'aller-retour le dépasse : fais le plein avant le retour)":""}.</p>`
        :`<div class="navlist">${f.stops.map((x,i)=>`<a class="navbtn" href="${wazeUrl(x)}" target="_blank" rel="noopener"><span>Plein ${i+1} · ${esc(x.name)} · km ${fmtInt(x.rk)}</span><small>Waze</small></a>`).join("")}</div>
          ${f.stuck?`<p class="err">Impossible de tenir sans plein supplémentaire hors de la route.</p>`:""}`}`;
  }
  // ferries + routes fermées
  const closures=a.data?a.data.closures:[];
  const rows=[
    ...ferries.map(f=>`<div class="info-row"><span class="tag">Ferry</span><div><div class="k">${esc(f.from.name)} → ${esc(f.to.name)}</div><div class="hint">${fmtDur(f.min)} comptées, arrivée au port vers ${fmtTime(f.at)}. Réserve et vérifie l'horaire de départ.</div></div></div>`),
    ...closures.map(x=>{ const closed=isClosedOn(x.p,date); return `<div class="info-row"><span class="tag ${closed?"stop":"ok"}">${closed?"Fermée":"Ouverte"}</span><div><div class="k">${esc(x.name)} · km ${fmtInt(x.km)}</div><div class="hint">Fermée en général ${fmtPeriod(x.p)}${closed?" : ce jour-là, la route est en principe fermée. Prévois un autre passage.":", selon la neige : vérifie avant de partir."}</div></div></div>`; })];
  const countries=route.points.map(p=>p.ctx||"").join(" ");
  const links=[[/Norvège|Norway|Norge/i,"Norvège","https://www.vegvesen.no/trafikk/"],[/France/i,"France","https://www.bison-fute.gouv.fr/"],[/Suisse|Schweiz|Switzerland/i,"Suisse","https://www.alpen-paesse.ch/"],[/Suède|Sweden|Sverige/i,"Suède","https://www.trafikverket.se/trafikinformation/"]].filter(([re])=>re.test(countries));
  const routesPanel = rows.length||links.length ? `<div class="panel"><h3>Ferries et routes</h3>
      ${rows.join("")||`<p class="hint">${a.data?"Aucun ferry ni route à fermeture saisonnière sur ce trajet.":"Recherche des routes à fermeture saisonnière…"}</p>`}
      ${links.length?`<div class="linkrow"><span class="hint">État des routes en direct :</span>${links.map(([,n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")}</div>`:""}
      <p class="hint">Fermetures saisonnières d'après OpenStreetMap : les dates réelles dépendent de la neige.</p>
    </div>` : "";
  return `<div class="panel"><h3>Carburant</h3>${costLine}${fuel}</div>${routesPanel}`;
}

/* ---------- partage avec le groupe ---------- */
function b64uEnc(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uDec(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; return Uint8Array.from(atob(t), ch=>ch.charCodeAt(0)); }
function shareable(r){
  const strip=o=>{ const c={...o}; ["legs","legsKey","legsSource","geom","geomKey","isDefault","template","source"].forEach(k=>delete c[k]); return c; };
  return isVoyage(r) ? {...strip(r), days:r.days.map(strip)} : strip(r);
}
async function encodeShare(r){
  const bytes=new TextEncoder().encode(JSON.stringify({v:1, r:shareable(r)}));
  if(window.CompressionStream){ try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "1."+b64uEnc(new Uint8Array(await new Response(st).arrayBuffer())); }catch(e){} }
  return "0."+b64uEnc(bytes);
}
async function decodeShare(code){
  const ver=code.slice(0,1); let bytes=b64uDec(code.slice(2));
  if(ver==="1"){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o || !o.r || !(isVoyage(o.r) ? Array.isArray(o.r.days) : Array.isArray(o.r.points))) throw new Error("Lien de partage illisible.");
  return o.r;
}
const shareUrls={};

function prepareShare(r){
  const sig=JSON.stringify(shareable(r));
  if(shareUrls[r.id] && shareUrls[r.id].sig===sig) return shareUrls[r.id].url;
  shareUrls[r.id]={sig, url:null};
  encodeShare(r).then(code=>{ shareUrls[r.id].url=location.origin+location.pathname+"#p="+code; const b=document.getElementById("share"); if(b) b.disabled=false; });
  return null;
}
function shareSummary(r){

    return `${r.name} · ${dayRange(r)} · ${fmtKm(t.km)}${ce!=null?` · carburant ≈ ${fmtEur(ce)} par moto`:""}\n`+r.days.map((d,i)=>{

      const tl=timeline(d,false,toMin(d.aller.start)), dv=dayVerdict(d);
      return `J${i+1} ${fmtDate(d.date)} : ${d.points[0].name} → ${d.points.at(-1).name}, ${fmtKm(totals(d).km)}, départ ${fmtTime(tl[0].min)}${dv.cls?" · "+dv.label:""}`;
    }).join("\n");
  }
  let line=`${r.name} : ${r.points.map(p=>p.name).join(" → ")} (${fmtKm(totals(r).km)})`;
  const w=getWx(r,state.day||todayIso());
  if(w.data){ const v=verdictOf(sampleTrip(r,false,r.aller,w.data).agg); line+=`\n${dayLabel(state.day||todayIso())}, départ ${r.aller.start} : ${VERDICT[v.lvl].label}${v.reasons[0]?" ("+v.reasons[0].t+")":""}`; }

}

function bindShare(r){
  const b=document.getElementById("share"); if(!b) return;
  b.onclick=()=>{

    const text=shareSummary(r)+"\n\nOuvre le lien pour voir la carte, la météo et la navigation :";

}
function addShared(src){
  const r=JSON.parse(JSON.stringify(src)), id=(isVoyage(r)?"v":"r")+Date.now().toString(36);

}

// OpenStreetMap (Overpass) : serveur principal, puis serveur de secours s'il est saturé
const OVERPASS=["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
async function overpass(q){
  let last;
  for(const u of OVERPASS){
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),70000);
    try{
      const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q),signal:ctl.signal});
      if(!r.ok) throw new Error(r.status);
      return await r.json();
    }catch(e){ last=e; } finally{ clearTimeout(t); }
  }
  throw last||new Error("overpass");
}

function openLoop(){
  const now=new Date(), late=now.getHours()>=16;
  if(!state.loop) state.loop={start:homePoint(), dur:180, date:late?addDays(todayIso(),1):todayIso(),
    time: late ? "10:00" : String(Math.min(20,now.getHours()+1)).padStart(2,"0")+":00", variants:[], busy:false, done:0, err:""};
  state.draft={points:[]}; state.dayCtx=null; state.view="loop"; render(); window.scrollTo(0,0);
}
// villages, cols et points de vue autour du départ (OpenStreetMap, via Overpass)
async function loopPlaces(c, radiusKm){
  const R=Math.round(Math.min(90,radiusKm)*1000), a=`(around:${R},${c.lat.toFixed(4)},${c.lon.toFixed(4)})`;
  const q=`[out:json][timeout:25];(node["place"~"^(village|town)$"]${a};node["mountain_pass"="yes"]${a};node["tourism"="viewpoint"]["name"]${a};);out body 1500;`;
  return ((await overpass(q)).elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>({name:e.tags.name, lat:e.lat, lon:e.lon,
    kind:e.tags.mountain_pass==="yes"?"col":e.tags.tourism==="viewpoint"?"vue":"lieu",
    ctx:e.tags.mountain_pass==="yes"?(e.tags.ele?`Col · ${e.tags.ele} m`:"Col"):e.tags.tourism==="viewpoint"?"Point de vue":(e.tags.place==="town"?"Ville":"Village")}));
}
// une boucle = le départ + 4 étapes sur un pentagone, accrochées au col / point de vue / village le plus proche
function loopPoints(start, r, deg, places){
  const c=offset(start, r, deg), used=new Set(), pts=[];
  for(let k=1;k<=4;k++){
    const raw=offset(c, r, deg+180+k*72);
    const near=(kinds,max)=>places.filter(p=>kinds.includes(p.kind) && !used.has(p.name) && haversine(p,start)>r*0.35)
      .map(p=>({p,d:haversine(p,raw)})).filter(x=>x.d<max).sort((a,b)=>a.d-b.d)[0];
    const hit=near(["col","vue"], r*0.3) || near(["lieu"], r*0.45);
    if(hit){ used.add(hit.p.name); pts.push({name:hit.p.name, ctx:hit.p.ctx, lat:hit.p.lat, lon:hit.p.lon}); }
    else pts.push({name:`Point ${k}`, ctx:"", lat:+raw.lat.toFixed(5), lon:+raw.lon.toFixed(5)});
  }
  return [start, ...pts, {...start}];
}
async function buildLoops(){
  const L=state.loop, start=L.start; if(!start){ toast("Choisis d'abord un point de départ"); return; }
  L.busy=true; L.done=0; L.err=""; L.variants=[]; render();
  const targetKm=L.dur/60*LOOP_KMH, r0=targetKm/LOOP_DETOUR/5.878;
  let places=[]; try{ places=await loopPlaces(start, r0*2.6+5); }catch(e){}
  const out=[];
  for(const dir of DIRS){
    try{
      let r=r0, best=null;
      for(let attempt=0; attempt<2; attempt++){
        const pts=loopPoints(start, r, dir.deg, places);
        const res=await fetchLegs(pts, true);
        const min=res.legs.reduce((s,l)=>s+l.min,0);
        best={pts,res,min};
        if(Math.abs(min-L.dur)/L.dur<0.25) break;
        r*=Math.max(0.6,Math.min(1.6,L.dur/Math.max(min,1)));
        await new Promise(z=>setTimeout(z,900));
      }
      const route={id:"loop-"+dir.deg, name:`Boucle ${dir.label}`, dir:dir.label, moto:true, isDefault:false, points:best.pts,
        aller:{start:L.time,end:L.time}, retour:{on:false,start:L.time,end:L.time}, legs:best.res.legs, legsSource:best.res.engine, geom:best.res.geom};
      route.legsKey=route.geomKey=rkey(route);
      out.push(route);
    }catch(e){}
    L.done++; if(state.view==="loop") render();
    await new Promise(z=>setTimeout(z,900));
  }
  L.variants=out; L.busy=false; if(!out.length) L.err="Calcul impossible pour le moment. Vérifie ta connexion et réessaie.";
  render();
}
function loopScore(route){
  const w=getWx(route, state.loop.date); if(!w.data) return {score:500, w};
  const g=sampleTrip(route,false,route.aller,w.data).agg, v=verdictOf(g);
  return {score:v.lvl*1000+(g.rain||0)*60+(g.prob||0)+Math.max(0,(g.gust||0)-30)*2+Math.max(0,12-(g.tMin??12))*4, w, g, v};
}

/* ---------- road trip préparé par Claude ---------- */
function claudePrompt(f){
  return `Prépare-moi un road trip moto pour l'appli « Roule ou pas ».

- Départ : ${f.from||"(à préciser)"}
- ${f.loop?"Retour au point de départ (boucle)":"Destination ou région : "+(f.to||"(à préciser)")}
- Date de départ : ${f.date||"(à préciser)"}
- Nombre de jours : ${f.days}
- Distance maximum par jour : ${f.km} km${f.duo?"\n- En duo, avec bagages":""}
- ${f.moto?"Éviter autoroutes et péages autant que possible":"Autoroutes acceptées pour les liaisons"}
- Envies : ${f.wish||"belles routes moto, cols, points de vue"}

Règles :
- Une journée = un départ, 2 à 6 étapes précises (villes, cols, points de vue) puis le lieu de la nuitée ; la journée suivante repart de cette nuitée.
- Donne des coordonnées GPS exactes (latitude, longitude en degrés décimaux) pour chaque étape.
- Si une étape s'atteint en ferry, ajoute "ferry_min" (durée de traversée en minutes, embarquement compris) sur l'étape d'arrivée.
- Une note courte par journée : réservations, routes fermées selon la saison, points forts, pièges.

Réponds uniquement avec ce JSON, entre balises \`\`\`json :
{"rouleoupas":1,"name":"Nom du road trip","start_date":"${f.date||"AAAA-MM-JJ"}","days":[{"day":1,"start":"09:00","note":"…","stops":[{"name":"Lieu","region":"Région, Pays","lat":0.0,"lon":0.0},{"name":"Lieu","region":"Région, Pays","lat":0.0,"lon":0.0,"ferry_min":0}]}]}`;
}

function bindClaude(onDone){
  const $=id=>document.getElementById(id); if(!$("cf-copy")) return;
  ["cf-from","cf-to","cf-date","cf-days","cf-km","cf-wish","cf-answer"].forEach(id=>{ if($(id)) $(id).oninput=()=>readClaudeForm(); });
  ["cf-duo","cf-moto"].forEach(id=>$(id).onchange=()=>readClaudeForm());
  $("cf-loop").onchange=()=>{ readClaudeForm(); render(); };
  $("cf-copy").onclick=async()=>{
    const txt=claudePrompt(readClaudeForm());
    try{ await navigator.clipboard.writeText(txt); toast("Demande copiée : colle-la dans Claude"); }
    catch(e){ const a=$("cf-answer"); a.value=txt; a.focus(); a.select(); toast("Copie auto impossible : copie le texte sélectionné"); }
  };
  $("cf-import").onclick=async()=>{
    const f=readClaudeForm(); state.cErr="";
    const link=(f.answer||"").match(/#p=([A-Za-z0-9._-]+)/);
    if(link){ try{ const r=await decodeShare(link[1]); f.answer=""; state.vdraft=null; addShared(r); }catch(e){ state.cErr="Ce lien de partage est incomplet ou abîmé."; render(); } return; }
    try{
      const v=await voyageFromClaude(f.answer, f.moto);
      onDone(v); f.answer="";
    }catch(e){ state.cErr=e.message; render(); }
  };
}
async function geocodeAny(name){
  try{ const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&format=json&name="+encodeURIComponent(name));
    const x=(await r.json()).results?.[0]; return x?{lat:x.latitude, lon:x.longitude}:null; }catch(e){ return null; }
}
const validTime = t => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t||"")) ? t : null;
async function voyageFromClaude(text, moto){
  if(!text || !text.trim()) throw new Error("Colle d'abord la réponse de Claude.");
  const m=text.match(/```(?:json)?\s*([\s\S]*?)```/), raw=m?m[1]:text.slice(text.indexOf("{"), text.lastIndexOf("}")+1);
  let d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Je ne trouve pas le bloc de données dans ce texte. Colle toute la réponse de Claude."); }
  if(!d || !Array.isArray(d.days) || !d.days.length) throw new Error("Aucune journée dans cette réponse.");
  const start=/^\d{4}-\d{2}-\d{2}$/.test(d.start_date||"") ? d.start_date : addDays(todayIso(),7);
  const v={id:"v"+Date.now().toString(36), kind:"voyage", source:"claude", name:String(d.name||"Road trip").slice(0,60), days:[]};
  for(const [k,day] of d.days.entries()){
    const pts=[];
    for(const st of (day.stops||[])){
      if(!st || !st.name) continue;
      let lat=+st.lat, lon=+st.lon;
      if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0)){ const g=await geocodeAny(st.name); if(!g) continue; lat=g.lat; lon=g.lon; }
      pts.push({name:String(st.name).slice(0,60), ctx:String(st.region||"").slice(0,60), lat, lon, ...(+st.ferry_min>0?{ferry:Math.round(+st.ferry_min)}:{})});
    }
    if(pts.length<2) continue;
    if(pts[0].ferry) delete pts[0].ferry;
    const n=Number.isFinite(+day.day)&&+day.day>0 ? +day.day : k+1, t=validTime(day.start)||"09:00";
    v.days.push(migrateDay({date:addDays(start,n-1), aller:{start:t,end:t}, note:String(day.note||"").slice(0,400), points:pts, moto:!!moto}));
  }
  if(!v.days.length) throw new Error("Aucune journée exploitable : il faut au moins un départ et une arrivée par jour.");
  v.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return v;
}

/* ---------- éditeur de road trip ---------- */
function upsertVoyage(v){
  if(!v.name.trim() && v.days.some(ready)){ const r=v.days.filter(ready); v.name=`${r[0].points[0].name} → ${r.at(-1).points.at(-1).name}`; }
  const copy=JSON.parse(JSON.stringify(v)), i=state.routes.findIndex(r=>r.id===v.id);
  if(i>=0) state.routes[i]=copy; else state.routes.push(copy);
  state.vNew=false;
  return save();
}

  bindTemplate("tpl", start=>{ const t=instantiate(CAP_NORD,start); t.id=v.id; if(v.name.trim()) t.name=v.name; state.vdraft=t; upsertVoyage(t); prefetchVoyage(t.id); render(); toast("Road trip Cap Nord créé"); });
  $("back").onclick=()=>{ const saved=state.routes.some(r=>r.id===v.id); state.vdraft=null; saved&&v.days.length ? openVoyage(v.id) : (state.view="list", render()); };
  $("addday").onclick=()=>editDay(-1);
  app.querySelectorAll("[data-eday]").forEach(b=>b.onclick=()=>editDay(+b.dataset.eday));

  };
  if($("vdel")) $("vdel").onclick=()=>{ state.confirmDelete=true; render(); };
  if($("vdelyes")) $("vdelyes").onclick=()=>{ state.routes=state.routes.filter(r=>r.id!==v.id); save(); state.vdraft=null; state.view="list"; render(); toast("Road trip supprimé"); };
  if($("vdelno")) $("vdelno").onclick=()=>{ state.confirmDelete=false; render(); };
}
function editDay(i){
  const v=state.vdraft;
  state.dayCtx={i};
  state.draft = i>=0 ? JSON.parse(JSON.stringify(v.days[i])) : newDay(v.days.at(-1));
  state.isNew = i<0; state.confirmDelete=false; state.routingErr=false; state.view="edit";

}
function leaveDay(msg){
  state.dayCtx=null; state.draft=null; state.confirmDelete=false; state.view="voyage-edit";
