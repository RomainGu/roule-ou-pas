<title>Roule ou Pas</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne mobile, trajet par défaut en tête, cartes itinéraire empilées */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#1c2329; --muted:#5b6672; --line:#d4d9de;
  --accent:#f2b705; --accent-ink:#1c2329; --road:#3a444d; --road-ink:#e8ecef; --danger:#b8352a; --warn:#d9822b; --ok:#2f8f5b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14191e; --surface:#1f262d; --ink:#e8ecef; --muted:#94a0ab; --line:#313a43;
  --accent:#f5c518; --accent-ink:#14191e; --road:#2a323a; --road-ink:#e8ecef; --danger:#e0655a; --warn:#f0a050; --ok:#4cc38a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button:disabled{opacity:.35}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 170px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{font:700 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:4px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font:700 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:700 18px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:focus-visible,input:focus-visible,.card:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.stack{display:flex;flex-direction:column;gap:18px}
.list{display:flex;flex-direction:column;gap:12px}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;cursor:pointer;text-align:left;width:100%}
.card.hero{border:2px solid var(--accent)}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font:700 20px/1.1 var(--display);text-transform:uppercase}
.card .path{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legs{display:flex;flex-direction:column;gap:2px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px}
.legs b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
.chip.accent{background:var(--accent);color:var(--accent-ink)}
.chip.todo{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.sketch{width:100%;height:100%;display:block}
.mapbox{position:relative;height:140px;border-radius:8px;overflow:hidden;background:var(--road);isolation:isolate}
.mapbox.big{height:240px}
.card .mapbox{pointer-events:none}
.mapbox .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.mapbox .leaflet-container{width:100%;height:100%;background:var(--road);font:inherit}
.mapbox .leaflet-control-attribution{font-size:9px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted)}
.mapbox .leaflet-control-attribution a{color:var(--muted)}
.mapbox .empty-map{position:absolute;inset:0;display:grid;place-items:center;color:var(--road-ink);opacity:.6;font:700 15px/1.2 var(--display);text-transform:uppercase;text-align:center;padding:12px}
.update{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--accent-ink);padding:10px 12px;border-radius:0 0 10px 10px;font-weight:600}
.update .btn{background:var(--accent-ink);color:var(--accent);padding:8px 12px}
.version{font-size:12px;color:var(--muted);text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tab{border:0;background:transparent;border-radius:10px;padding:10px;font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.gear-list{display:flex;flex-direction:column}
.gear{display:flex;flex-direction:column;gap:6px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.gear:first-child{border-top:0;padding-top:0}
.gear-name{font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--ink)}
input[type=number]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px 22px;font-size:17px}

/* éditeur */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=search],input[type=time]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);background:var(--road);color:var(--road-ink)}
.step.end .dot{background:var(--accent);color:var(--accent-ink)}
.step .txt{min-width:0}
.step .city{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step .acts{display:flex;gap:4px}
.step .acts .icon-btn{width:34px;height:34px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.results button{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:11px 12px;cursor:pointer}
.results button:first-child{border-top:0}
.results small{color:var(--muted);display:block}
.hint{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
.slot{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--bg)}
.slot-out{font-size:14px;font-variant-numeric:tabular-nums}
.slot-out b{font-weight:600}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.summary b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.bar .btn{flex:1 1 140px}
.confirm{display:flex;flex-direction:column;gap:10px;border:1px solid var(--danger);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
/* météo */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:center;line-height:1.15}
.day small{display:block;font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.wx{display:flex;flex-direction:column;gap:10px}
.wx-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wx-sky{font-weight:600}
.wx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wx-cell{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;min-width:0}
.wx-cell b{display:block;font:700 20px/1.05 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-cell span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wx-cell small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .wx{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px}
.flag{font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--bg);border-left:4px solid var(--warn)}
.pts{overflow-x:auto}
.pts table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:360px}
.pts th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.pts td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pts td:first-child{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pts td small{display:block;color:var(--muted);font-weight:400}
.past{opacity:.55}
.verdict{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:6px solid var(--ok)}
.verdict b{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ok)}
.verdict span{font-size:14px}
.verdict.warn{border-left-color:var(--warn)} .verdict.warn b{color:var(--warn)}
.verdict.stop{border-left-color:var(--danger)} .verdict.stop b{color:var(--danger)}
.outfit{display:flex;flex-direction:column;gap:6px}
.kit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.kit li{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-weight:600}
.kit li:first-child{border-top:0}
.kit .zone{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kit small{font-weight:400;color:var(--warn)}
.kit-line{font-size:14px;font-weight:600}
.kit-line .lbl{margin-right:4px}
.rule{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule label{font-size:15px;min-width:0}
.rule-in{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.rule-in input{width:86px !important;text-align:right}
.rule-in small{font-size:12px;color:var(--muted);width:70px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.985)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const KEY = "rouleoupas.routes.v1";
const FALLBACK_KMH = 55, FALLBACK_FACTOR = 1.3; // utilisés seulement si le calcul routier échoue

/* ---------- modèle & stockage ---------- */
function defaultRoute(){
  return {id:"maison-boulot", name:"Maison ↔ Boulot", isDefault:true, points:[],
    aller:{start:"07:30", end:"08:00"}, retour:{on:true, start:"17:30", end:"18:00"},
    legs:null, legsKey:"", legsSource:""};
}
function migrate(r){
  if(!r.aller){ const d=r.departure||"08:00"; r.aller={start:d,end:d}; }
  if(!r.retour) r.retour={on:false,start:"17:30",end:"18:00"};
  delete r.departure; delete r.speed;
  if(!("legs" in r)){ r.legs=null; r.legsKey=""; r.legsSource=""; }
  return r;
}
function load(){
  let routes=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) routes=JSON.parse(raw); }catch(e){}
  routes=(routes||[]).filter(r=>!r.example).map(migrate);
  if(!routes.length) routes.push(defaultRoute());
  return routes;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.routes)); return true; }
  catch(e){ toast("Enregistrement impossible sur cet appareil"); return false; }
}
const state = { rules:{}, pendingMaps:[], tab:"trajets", gear:[], routes: load(), view:"list", draft:null, confirmDelete:false, routing:false, routingErr:false };
save();
try{ state.gear=JSON.parse(localStorage.getItem("rouleoupas.gear.v1"))||[]; }catch(e){}

/* ---------- temps ---------- */
const toMin = s => { const [h,m]=(s||"00:00").split(":").map(Number); return h*60+m; };
const fmtTime = min => { const t=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); };
const fmtDur = min => { const r=Math.round(min); const h=Math.floor(r/60), m=r%60; return h? `${h} h ${String(m).padStart(2,"0")}` : `${m} min`; };
const fmtKm = km => (km<10? km.toFixed(1).replace(".",",") : Math.round(km).toLocaleString("fr-FR"))+" km";
const fmtSlot = (a,b) => a===b ? fmtTime(a) : `${fmtTime(a)}–${fmtTime(b)}`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- calcul routier ---------- */
const keyOf = pts => pts.map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5)).join(";");
function haversine(a,b){
  const R=6371, t=x=>x*Math.PI/180, dLat=t(b.lat-a.lat), dLon=t(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function estimateLegs(pts){
  return pts.slice(1).map((p,i)=>{ const km=haversine(pts[i],p)*FALLBACK_FACTOR; return {km, min:km/FALLBACK_KMH*60}; });
}
async function fetchLegs(pts){
  const coords=pts.map(p=>p.lon+","+p.lat).join(";");
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`);
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); if(d.code!=="Ok"||!d.routes?.length) throw new Error(d.code);
  return {legs:d.routes[0].legs.map(l=>({km:l.distance/1000, min:l.duration/60})), geom:thin(d.routes[0].geometry.coordinates)};
}
// tronçons pour un ordre de points ; le retour réutilise les tronçons de l'aller, inversés
function legsFor(route, reverse){
  let legs=route.legs && route.legsKey===keyOf(route.points) ? route.legs : estimateLegs(route.points);
  return reverse ? legs.slice().reverse() : legs;
}
function timeline(route, reverse, startMin){
  const pts = reverse ? route.points.slice().reverse() : route.points;
  const legs = legsFor(route, reverse);
  let km=0, m=startMin; const out=[{pt:pts[0],km:0,min:m}];
  legs.forEach((l,i)=>{ km+=l.km; m+=l.min; out.push({pt:pts[i+1],km,min:m}); });
  return out;
}
const totals = route => { const l=legsFor(route,false); return {km:l.reduce((s,x)=>s+x.km,0), min:l.reduce((s,x)=>s+x.min,0)}; };
const isEstimate = route => !(route.legs && route.legsKey===keyOf(route.points) && route.legsSource==="osrm");

async function ensureRouting(){
  const d=state.draft; if(!d || d.points.length<2) return;
  const k=keyOf(d.points);
  if(d.legsKey===k && d.legsSource==="osrm" && d.geomKey===k) return;
  if(state.routing===k) return;
  state.routing=k; state.routingErr=false;
  try{
    const res=await fetchLegs(d.points);
    if(state.draft!==d || keyOf(d.points)!==k) return;
    d.legs=res.legs; d.geom=res.geom; d.geomKey=k; d.legsKey=k; d.legsSource="osrm";
  }catch(e){
    if(state.draft===d){ d.legs=estimateLegs(d.points); d.legsKey=k; d.legsSource="estimate"; state.routingErr=true; }
  }finally{ if(state.routing===k) state.routing=false; if(state.view==="edit") render(); }
}

// allège le tracé : points arrondis à ~1 m, en sautant ceux à moins de ~25 m du précédent
function thin(coords){
  const out=[]; let last=null;
  for(const [lon,lat] of coords){
    if(last && Math.abs(lat-last[0])<0.00022 && Math.abs(lon-last[1])<0.00033) continue;
    last=[+lat.toFixed(5), +lon.toFixed(5)]; out.push(last);
  }
  const end=coords.at(-1); if(end) out.push([+end[1].toFixed(5), +end[0].toFixed(5)]);
  return out;
}
// complète le tracé des itinéraires déjà enregistrés qui n'en ont pas encore
const geomPending={};
async function ensureGeom(route){
  if(!ready(route) || (route.geom && route.geomKey===keyOf(route.points)) || geomPending[route.id]) return;
  geomPending[route.id]=true;
  try{
    const res=await fetchLegs(route.points);
    route.legs=res.legs; route.geom=res.geom; route.geomKey=route.legsKey=keyOf(route.points); route.legsSource="osrm";
    save(); if(state.view!=="edit") render();
  }catch(e){} finally{ setTimeout(()=>delete geomPending[route.id], 60000); }
}

/* ---------- carte ---------- */
let liveMaps=[];
const isDark = () => document.documentElement.dataset.theme==="dark" || (document.documentElement.dataset.theme!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
function mapBox(route, mode){
  const id="m"+Math.random().toString(36).slice(2,8);
  if(!ready(route)) return `<div class="mapbox"><div class="empty-map">Ajoute tes adresses<br>pour voir le trajet</div></div>`;
  state.pendingMaps.push({id, route, interactive: mode==="detail"});
  return `<div class="mapbox${mode==="card"?"":" big"}" id="${id}" aria-label="Carte du trajet"></div>`;
}
function mountMaps(){
  liveMaps.forEach(m=>{ try{m.remove();}catch(e){} }); liveMaps=[];
  const jobs=state.pendingMaps; state.pendingMaps=[];
  jobs.forEach(({id, route, interactive})=>{
    const el=document.getElementById(id); if(!el) return;
    if(!window.L){ el.innerHTML=sketch(route.points); return; } // hors ligne : croquis simple
    const opts=interactive?{zoomControl:true}:{zoomControl:false,dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,keyboard:false,tap:false};
    const map=L.map(el,{...opts, attributionControl:true});
    map.attributionControl.setPrefix(false);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:19, className:isDark()?"tiles-dark":"", attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    const css=getComputedStyle(document.documentElement), accent=css.getPropertyValue("--accent").trim()||"#f2b705", ink=css.getPropertyValue("--ink").trim()||"#1c2329";
    const hasGeom = route.geom && route.geomKey===keyOf(route.points);
    const line = hasGeom ? route.geom : route.points.map(p=>[p.lat,p.lon]);
    L.polyline(line,{color:ink,weight:7,opacity:.35}).addTo(map);
    L.polyline(line,{color:accent,weight:4,opacity:1,dashArray:hasGeom?null:"6 8"}).addTo(map);
    route.points.forEach((p,i)=>{
      const end=i===0||i===route.points.length-1;
      L.circleMarker([p.lat,p.lon],{radius:end?7:5,color:ink,weight:2,fillColor:end?accent:"#ffffff",fillOpacity:1}).addTo(map)
        .bindTooltip(p.name,{direction:"top",offset:[0,-6]});
    });
    map.fitBounds(L.latLngBounds(line),{padding:[18,18]});
    liveMaps.push(map);
    if(!hasGeom) ensureGeom(route);
  });
}

/* ---------- version ---------- */
const APP_VERSION="2026.10.04-7";
// compare deux versions « AAAA.MM.JJ-N » : positif si a est plus récente que b
const cmpVer=(a,b)=>{ const p=v=>v.split(/[.-]/).map(Number); const x=p(a), y=p(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
let newVersion=null;
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
    const m=(await r.text()).match(/APP_VERSION="([^"]+)"/);
    if(m && cmpVer(m[1],APP_VERSION)>0 && newVersion!==m[1]){ newVersion=m[1]; if(state.view!=="edit" && state.view!=="gear-edit") render(); }
  }catch(e){}
}
function updateBanner(){
  return newVersion ? `<div class="update"><span>Nouvelle version disponible</span><button class="btn" id="do-update">Mettre à jour</button></div>` : "";
}
function bindUpdate(){
  const b=document.getElementById("do-update");
  if(b) b.onclick=()=>location.replace(location.pathname+"?v="+encodeURIComponent(newVersion));
}

/* ---------- croquis du tracé ---------- */
function sketch(points, size=84){
  if(points.length<2) return `<svg class="sketch" viewBox="0 0 ${size} ${size}" aria-hidden="true"><text x="50%" y="54%" text-anchor="middle" font-size="26" fill="var(--road-ink)" opacity=".5">?</text></svg>`;
  const xs=points.map(p=>p.lon*Math.cos(p.lat*Math.PI/180)), ys=points.map(p=>-p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY)||1, pad=14, s=(size-pad*2)/span;
  const ox=(size-(maxX-minX)*s)/2, oy=(size-(maxY-minY)*s)/2;
  const pts=points.map((p,i)=>[ox+(xs[i]-minX)*s, oy+(ys[i]-minY)*s]);
  const d=pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
  const dots=pts.map((p,i)=>{const end=i===0||i===pts.length-1;return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${end?4.5:3}" fill="${end?'var(--accent)':'var(--road-ink)'}"/>`;}).join("");
  return `<svg class="sketch" viewBox="0 0 ${size} ${size}" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- météo ---------- */
const WX_KEY="rouleoupas.wx.v1", WX_TTL=30*60*1000, WX_RETRY=60*1000;
const wx={cache:{}, pending:{}, err:{}};
try{ wx.cache=JSON.parse(localStorage.getItem(WX_KEY))||{}; }catch(e){}
const isoDate = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); return isoDate(new Date(y,m-1,d+n)); };
const todayIso = () => isoDate(new Date());
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const ready = r => r.points.length>=2;
function defaultDay(route){
  // une fois le dernier trajet du jour terminé, on affiche demain
  if(!ready(route)) return todayIso();
  const last=route.retour.on?route.retour:route.aller;
  const end=timeline(route,route.retour.on,toMin(last.end)).at(-1).min;
  return nowMin()>end ? addDays(todayIso(),1) : todayIso();
}
function dayLabel(iso, short){
  const t=todayIso();
  if(iso===t) return "Aujourd'hui";
  if(iso===addDays(t,1)) return "Demain";
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("fr-FR", short?{weekday:"short"}:{weekday:"long",day:"numeric",month:"long"});
}
async function fetchWx(points, date){
  const lat=points.map(p=>p.lat.toFixed(4)).join(","), lon=points.map(p=>p.lon.toFixed(4)).join(",");
  const vars="temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,visibility";
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&start_date=${date}&end_date=${addDays(date,1)}`);
  if(!r.ok) throw new Error(r.status);
  let d=await r.json(); if(!Array.isArray(d)) d=[d];
  return d.map(x=>x.hourly);
}
function saveWx(){
  const t=todayIso();
  for(const k in wx.cache) if(k.split("|")[1]<t) delete wx.cache[k];
  try{ localStorage.setItem(WX_KEY, JSON.stringify(wx.cache)); }catch(e){}
}
function getWx(route, date, force){
  const k=keyOf(route.points)+"|"+date, c=wx.cache[k];
  if(force){ delete wx.err[k]; if(c) c.at=0; }
  const fresh = c && Date.now()-c.at<WX_TTL, recentErr = wx.err[k] && Date.now()-wx.err[k]<WX_RETRY;
  if(!fresh && !wx.pending[k] && !recentErr){
    wx.pending[k]=true;
    fetchWx(route.points,date)
      .then(h=>{ wx.cache[k]={at:Date.now(), hourly:h}; delete wx.err[k]; saveWx(); })
      .catch(()=>{ wx.err[k]=Date.now(); })
      .finally(()=>{ delete wx.pending[k]; if(state.view!=="edit") render(); });
  }
  return {data:c||null, loading:!!wx.pending[k], error:!!wx.err[k]};
}

const SKY = {0:"Ciel dégagé",1:"Peu nuageux",2:"Éclaircies",3:"Couvert",45:"Brouillard",48:"Brouillard givrant",
  51:"Bruine légère",53:"Bruine",55:"Bruine forte",56:"Bruine verglaçante",57:"Bruine verglaçante forte",
  61:"Pluie faible",63:"Pluie",65:"Pluie forte",66:"Pluie verglaçante",67:"Pluie verglaçante forte",
  71:"Neige faible",73:"Neige",75:"Neige forte",77:"Grains de neige",80:"Averses faibles",81:"Averses",82:"Averses violentes",
  85:"Averses de neige",86:"Fortes averses de neige",95:"Orage",96:"Orage avec grêle",99:"Orage avec forte grêle"};
function skyRank(c){
  if(c>=95) return 10; if([56,57,66,67].includes(c)) return 9; if((c>=71&&c<=77)||c===85||c===86) return 8;
  if(c===48) return 7; if(c===82) return 6.5; if(c>=80) return 6; if(c===65) return 5.5; if(c>=61) return 5;
  if(c>=51) return 4; if(c===45) return 3; return c/3; // 0 à 3 : nébulosité
}
const lo = a => a.length?Math.min(...a):NaN, hi = a => a.length?Math.max(...a):NaN;
function sampleTrip(route, reverse, slot, hourly){
  const n=route.points.length, a=timeline(route,reverse,toMin(slot.start)), b=timeline(route,reverse,toMin(slot.end));
  const per=a.map((s,j)=>{
    const h=hourly[reverse?n-1-j:j]; if(!h) return null;
    const rows=[]; for(let i=Math.max(0,Math.floor(s.min/60)); i<=Math.min(47,Math.floor(b[j].min/60)); i++) rows.push(i);
    const pick=k=>rows.map(i=>h[k]?.[i]).filter(v=>v!=null);
    const codes=pick("weather_code");
    return {pt:s.pt, m1:s.min, m2:b[j].min,
      tMin:lo(pick("temperature_2m")), tMax:hi(pick("temperature_2m")), feel:lo(pick("apparent_temperature")),
      rain:hi(pick("precipitation")), prob:hi(pick("precipitation_probability")),
      wind:hi(pick("wind_speed_10m")), gust:hi(pick("wind_gusts_10m")), vis:lo(pick("visibility")),
      code:codes.length?codes.reduce((w,c)=>skyRank(c)>skyRank(w)?c:w):NaN};
  }).filter(Boolean);
  const all=k=>per.map(p=>p[k]).filter(Number.isFinite);
  const worst=per.reduce((w,p)=>!w||skyRank(p.code)>skyRank(w.code)?p:w,null);
  return {per, end:b.at(-1).min,
    agg:{tMin:lo(all("tMin")), tMax:hi(all("tMax")), feel:lo(all("feel")), rain:hi(all("rain")), prob:hi(all("prob")),
         wind:hi(all("wind")), gust:hi(all("gust")), vis:lo(all("vis")), code:worst?.code, codeAt:worst?.pt?.name}};
}
const num = (v,suf="") => Number.isFinite(v) ? Math.round(v)+suf : "—";
const mm = v => !Number.isFinite(v) ? "—" : (v<0.05?"0":v.toFixed(1).replace(".",","))+" mm";
const visKm = v => !Number.isFinite(v) ? "—" : v>=10000 ? "10+ km" : (v/1000).toFixed(v<1000?1:0).replace(".",",")+" km";
function wxBlock(label, route, reverse, slot, data, date, detailed){
  const s=sampleTrip(route,reverse,slot,data.hourly), g=s.agg;
  const past = date===todayIso() && nowMin()>s.end;
  const cells=`<div class="wx-grid">
    <div class="wx-cell"><span>Temp.</span><b>${num(g.tMin,"°")}${Math.round(g.tMax)!==Math.round(g.tMin)&&Number.isFinite(g.tMax)?" / "+num(g.tMax,"°"):""}</b><small>à moto ≈ ${num(ride,"°")}</small></div>

    <div class="wx-cell"><span>Visib.</span><b>${visKm(g.vis)}</b><small>min.</small></div></div>`;
  const v=verdictOf(g), o=outfitOf(g), ride=rideFeel(g.tMin, avgSpeed(route));
  const flags=verdictHtml(v,!detailed)+outfitHtml(o,!detailed);
  const table = detailed ? `<div class="pts"><table><thead><tr><th>Passage</th><th>Temp.</th><th>Pluie</th><th>Rafales</th><th>Ciel</th></tr></thead><tbody>

    </tbody></table></div>` : "";
  return `<div class="wx${past?" past":""}">

/* ---------- verdict & tenue ---------- */
const RULES_KEY="rouleoupas.rules.v1";
const DEFAULT_RULES={rainWarn:0.3, rainStop:4, probWarn:60, coldWarn:4, coldStop:1, gustWarn:50, gustStop:75, visWarn:1000, visStop:200, heatWarn:33, rideSpeed:0};
const RULE_FIELDS=[
  ["Pluie", [["rainWarn","Prudence dès","mm/h",0.1],["rainStop","Pas aujourd'hui dès","mm/h",0.5],["probWarn","Prudence si risque d'averse ≥","%",5]]],
  ["Froid (température de l'air)", [["coldWarn","Prudence à","°C ou moins",1],["coldStop","Pas aujourd'hui à","°C ou moins",1]]],
  ["Vent", [["gustWarn","Prudence si rafales ≥","km/h",5],["gustStop","Pas aujourd'hui si rafales ≥","km/h",5]]],
  ["Brouillard", [["visWarn","Prudence si visibilité <","m",100],["visStop","Pas aujourd'hui si visibilité <","m",50]]],
  ["Chaleur", [["heatWarn","Prudence dès","°C",1]]],
];
const VERDICT=[{label:"Roule",cls:"go"},{label:"Prudence",cls:"warn"},{label:"Pas aujourd'hui",cls:"stop"}];
function verdictOf(g){
  const R=state.rules, out=[]; let lvl=0;
  const add=(l,t)=>{ out.push({l,t}); lvl=Math.max(lvl,l); };
  const fin=Number.isFinite;
  if(g.code>=95) add(2, g.code>=96?"Orage avec grêle":"Orage");
  if([56,57,66,67].includes(g.code)) add(2,"Pluie ou bruine verglaçante");
  if((g.code>=71&&g.code<=77)||g.code===85||g.code===86) add(2,"Neige");
  if(fin(g.tMin)){ if(g.tMin<=R.coldStop) add(2,`${num(g.tMin,"°C")} : risque de verglas`); else if(g.tMin<=R.coldWarn) add(1,`${num(g.tMin,"°C")} : chaussée froide, plaques possibles`); }
  if(fin(g.tMax)&&g.tMax>=R.heatWarn) add(1,`Forte chaleur (${num(g.tMax,"°C")}) : hydrate-toi`);
  if(fin(g.rain)&&g.rain>=R.rainStop) add(2,`Forte pluie (${mm(g.rain)}/h)`);
  else if(fin(g.rain)&&g.rain>=R.rainWarn) add(1,`Pluie (${mm(g.rain)}/h) : route glissante`);
  else if(fin(g.prob)&&g.prob>=R.probWarn) add(1,`Risque d'averse ${num(g.prob," %")}`);
  if(fin(g.gust)&&g.gust>=R.gustStop) add(2,`Rafales à ${num(g.gust)} km/h`);
  else if(fin(g.gust)&&g.gust>=R.gustWarn) add(1,`Rafales à ${num(g.gust)} km/h`);
  if(fin(g.vis)&&g.vis<R.visStop) add(2,`Brouillard épais (${visKm(g.vis)})`);
  else if(fin(g.vis)&&g.vis<R.visWarn) add(1,`Brouillard (${visKm(g.vis)})`);
  out.sort((a,b)=>b.l-a.l);
  return {lvl, reasons:out};
}
// température ressentie à moto (refroidissement éolien à la vitesse moyenne du trajet)
function rideFeel(t, kmh){
  if(!Number.isFinite(t)) return NaN;
  if(t>15 || kmh<5) return t;
  const v=Math.pow(kmh,0.16);
  return Math.min(t, 13.12+0.6215*t-11.37*v+0.3965*t*v);
}
function avgSpeed(route){ const t=totals(route); return state.rules.rideSpeed>0 ? state.rules.rideSpeed : (t.min>0 ? t.km/(t.min/60) : 50); }
const ZONES=["Haut","Bas","Mains","Pieds","Tête & cou"];
function outfitOf(g){
  const R=state.rules, gear=state.gear, T=g.tMin, Tx=Number.isFinite(g.tMax)?g.tMax:T;
  const wet=(g.rain>=R.rainWarn)||(g.prob>=R.probWarn);
  if(!gear.length || !Number.isFinite(T)) return {picks:[], wet, empty:!gear.length};
  const covers=(i,t)=>i.tMin<=t && t<=i.tMax;
  const isLayer=i=>/doublure/i.test(i.name);
  const picks=[];
  ZONES.forEach(z=>{
    const c=gear.filter(i=>i.cat===z && !isLayer(i)); if(!c.length) return;
    let ok=c.filter(i=>covers(i,T)), note="";
    if(!ok.length){
      if(z==="Tête & cou") return; // accessoire : seulement quand il fait froid
      const dist=i=>T<i.tMin? i.tMin-T : T-i.tMax;
      ok=[c.slice().sort((a,b)=>dist(a)-dist(b))[0]];
      note = T<ok[0].tMin ? "un peu juste pour ce froid" : "un peu chaud";
    }
    const score=i=>(covers(i,Tx)?2:0)+(wet&&i.waterproof?3:0)-(i.tMax-i.tMin)/60;
    ok.sort((a,b)=>score(b)-score(a));
    picks.push({zone:z, item:ok[0], note});
  });
  gear.filter(i=>isLayer(i)||i.cat==="Chauffant"||i.cat==="Moto").forEach(i=>{
    if(T<=i.tMax) picks.push({zone:i.cat==="Moto"?"Moto":"En plus", item:i, note:/gant/i.test(i.name)&&picks.some(p=>p.zone==="Mains")?"à la place des gants, à allumer":i.heated?"à allumer":""});
  });
  if(wet){
    const rain=gear.filter(i=>i.cat==="Pluie");
    const combi=rain.find(i=>/combi/i.test(i.name));
    (combi ? [combi, ...rain.filter(i=>!/combi|pantalon|veste/i.test(i.name))] : rain).forEach(i=>picks.push({zone:"Pluie", item:i, note:""}));
  }
  const dry = !wet || picks.some(p=>p.zone==="Pluie") || picks.filter(p=>p.zone==="Haut"||p.zone==="Bas").every(p=>p.item.waterproof);
  return {picks, wet, empty:false, noRainGear:!dry};
}
function verdictHtml(v, compact){
  const V=VERDICT[v.lvl];
  const why = v.reasons.length ? v.reasons.slice(0, compact?2:9).map(r=>esc(r.t)).join(" · ") : "Conditions sèches et douces";
  return `<div class="verdict ${V.cls}"><b>${V.label}</b><span>${why}</span></div>`;
}
function outfitHtml(o, compact){
  if(o.empty) return `<p class="hint">Ajoute ton matériel dans l'onglet Équipement pour savoir quoi mettre.</p>`;
  if(!o.picks.length) return "";
  const warn = o.noRainGear ? `<p class="err">Pluie prévue et rien d'étanche dans ton équipement.</p>` : "";
  if(compact) return `<div class="kit-line"><span class="lbl">Tenue</span> ${o.picks.map(p=>esc(p.item.name)).join(" · ")}</div>${warn}`;
  return `<div class="outfit"><div class="lbl">Tenue conseillée</div><ul class="kit">
    ${o.picks.map(p=>`<li><span class="zone">${esc(p.zone)}</span><span>${esc(p.item.name)}${p.note?` <small>${esc(p.note)}</small>`:""}</span></li>`).join("")}
  </ul>${warn}</div>`;
}
function loadRules(){ try{ const r=JSON.parse(localStorage.getItem(RULES_KEY)); if(r) return {...DEFAULT_RULES, ...r}; }catch(e){} return {...DEFAULT_RULES}; }
function saveRules(){ try{ localStorage.setItem(RULES_KEY, JSON.stringify(state.rules)); return true; }catch(e){ toast("Enregistrement impossible sur cet appareil"); return false; } }
function renderRules(){
  const R=state.rules;
  app.innerHTML = `
    <header class="top"><h1 class="brand">Roule <span>ou pas</span></h1></header>
    <div class="stack">
      <div class="eyebrow">Seuils du verdict</div>
      <p class="hint">Valeurs les plus défavorables sur ta plage horaire et sur tout le trajet. Orage, neige et pluie verglaçante donnent toujours « Pas aujourd'hui ».</p>
      ${RULE_FIELDS.map(([title,fields])=>`<div class="panel"><h3>${esc(title)}</h3>
        ${fields.map(([k,lbl,unit,step])=>`<div class="rule"><label for="r-${k}">${esc(lbl)}</label>
          <span class="rule-in"><input type="number" inputmode="decimal" id="r-${k}" value="${R[k]}" step="${step}"><small>${esc(unit)}</small></span></div>`).join("")}
      </div>`).join("")}
      <div class="panel"><h3>Ressenti à moto</h3>
        <p class="hint">Vitesse utilisée pour calculer le froid ressenti en roulant. Laisse 0 pour prendre la moyenne de chaque trajet.</p>
        <div class="rule"><label for="r-rideSpeed">Vitesse</label><span class="rule-in"><input type="number" inputmode="numeric" id="r-rideSpeed" value="${R.rideSpeed}" step="10" min="0"><small>km/h</small></span></div>
      </div>
      <div class="bar"><button class="btn btn-primary" id="r-save">Enregistrer</button><button class="btn btn-ghost" id="r-reset">Valeurs par défaut</button></div>
    </div>
    ${tabsBar()}`;
  bindTabs();
  document.getElementById("r-save").onclick=()=>{
    const next={...R};
    for(const k of Object.keys(DEFAULT_RULES)){ const el=document.getElementById("r-"+k); const v=Number(String(el.value).replace(",",".")); if(el.value!=="" && Number.isFinite(v)) next[k]=v; }
    if(next.rainStop<next.rainWarn || next.gustStop<next.gustWarn || next.coldStop>next.coldWarn || next.visStop>next.visWarn){ toast("Le seuil « Pas aujourd'hui » doit être plus sévère que « Prudence »"); return; }
    state.rules=next; if(saveRules()) toast("Seuils enregistrés");
  };
  document.getElementById("r-reset").onclick=()=>{ state.rules={...DEFAULT_RULES}; saveRules(); render(); toast("Valeurs par défaut rétablies"); };
}

/* ---------- vue liste ---------- */
function slotLine(label, route, reverse, slot){
  const s=toMin(slot.start), e=toMin(slot.end);
  if(!ready(route)) return `<span><b>${label}</b> départ ${fmtSlot(s,e)}</span>`;
  const a=timeline(route,reverse,s), b=timeline(route,reverse,e);
  return `<span><b>${label}</b> ${fmtSlot(s,e)} → arrivée ${fmtSlot(a.at(-1).min,b.at(-1).min)}</span>`;
}
function heroWx(route){
  if(!ready(route)) return "";
  const day=defaultDay(route), w=getWx(route,day);
  let body;
  if(w.data) body=wxBlock("Aller",route,false,route.aller,w.data,day,false)+(route.retour.on?wxBlock("Retour",route,true,route.retour,w.data,day,false):"");
  else body=`<p class="${w.error?"err":"hint"}">${w.error?"Météo indisponible. Vérifie ta connexion.":"Chargement de la météo…"}</p>`;

    </div>`;

  const $=id=>document.getElementById(id);
  $("back").onclick=()=>{const back=!state.isNew&&ready(d)&&state.routes.some(r=>r.id===d.id);state.draft=null;back?openDetail(d.id):(state.view="list",render());};
  $("name").oninput=e=>d.name=e.target.value;
  ["aller","retour"].forEach(w=>{
    const s=$(w+"-s"), e=$(w+"-e"); if(!s) return;
    s.onchange=()=>{d[w].start=s.value||d[w].start; if(toMin(d[w].end)<toMin(d[w].start)) d[w].end=d[w].start; render();};
    e.onchange=()=>{d[w].end=e.value||d[w].end; if(toMin(d[w].end)<toMin(d[w].start)) d[w].start=d[w].end; render();};
  });
  $("ret").onchange=e=>{d.retour.on=e.target.checked;render();};
  $("def").onchange=e=>{d.isDefault=e.target.checked;};
  app.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[d.points[i-1],d.points[i]]=[d.points[i],d.points[i-1]];render();});
  app.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[d.points[i+1],d.points[i]]=[d.points[i],d.points[i+1]];render();});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{d.points.splice(+b.dataset.del,1);render();});
  $("save").onclick=saveDraft;
  if($("del")) $("del").onclick=()=>{state.confirmDelete=true;render();};
  if($("delyes")) $("delyes").onclick=()=>{state.routes=state.routes.filter(r=>r.id!==d.id);save();state.draft=null;state.view="list";render();toast("Itinéraire supprimé");};
  if($("delno")) $("delno").onclick=()=>{state.confirmDelete=false;render();};

  let timer; const q=$("q");
  q.oninput=()=>{clearTimeout(timer);const v=q.value.trim();if(v.length<3){$("res").innerHTML="";return;}timer=setTimeout(()=>search(v),250);};
  $("gps").onclick=useMyPosition;
  ensureRouting();
}

/* ---------- recherche d'adresses et de villes ---------- */
const featToPlace = f => { const p=f.properties; return {
  name: p.type==="municipality" ? p.city : (p.name||p.label),
  ctx: [p.postcode, p.city].filter(Boolean).join(" "),
  lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]}; };
async function completeFR(text){
  // Géoplateforme IGN : autocomplétion d'adresses réelles en France, dès les premières lettres
  const r=await fetch("https://data.geopf.fr/geocodage/completion/?type=StreetAddress,PositionOfInterest&maximumResponses=6&text="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.results||[]).filter(x=>Number.isFinite(x.x)&&Number.isFinite(x.y)).map(x=>{
    const full=x.fulltext||[x.street,x.zipcode,x.city].filter(Boolean).join(" ");
    const cut=full.indexOf(",");
    return {name: cut>0?full.slice(0,cut):full, ctx: cut>0?full.slice(cut+1).trim():[x.zipcode,x.city].filter(Boolean).join(" "), lat:x.y, lon:x.x};
  });
}
async function searchFR(text){
  // repli : recherche plein texte (ex-API Adresse), si l'autocomplétion ne répond pas
  try{ const c=await completeFR(text); if(c.length) return c; }catch(e){}
  const r=await fetch("https://data.geopf.fr/geocodage/search?index=address&limit=6&q="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.features||[]).map(featToPlace);
}
async function reverseFR(lat, lon){
  const r=await fetch(`https://data.geopf.fr/geocodage/reverse?index=address&limit=1&lat=${lat}&lon=${lon}`);
  if(!r.ok) throw new Error(r.status);
  const f=(await r.json()).features?.[0];
  return f ? featToPlace(f) : {name:"Ma position", ctx:"", lat, lon};
}
function useMyPosition(){
  const res=document.getElementById("res");
  if(!navigator.geolocation){ res.innerHTML=`<p class="err">Ton téléphone ne donne pas accès à la position ici.</p>`; return; }
  res.innerHTML=`<p class="hint">Localisation…</p>`;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat, longitude:lon}=pos.coords;
    let place; try{ place=await reverseFR(lat,lon); }catch(e){ place={name:"Ma position", ctx:"", lat, lon}; }
    if(!state.draft) return;
    state.draft.points.push(place); render();
  }, err=>{
    res.innerHTML=`<p class="err">${err.code===1?"Position refusée. Autorise la localisation pour Safari dans Réglages › Confidentialité › Service de localisation.":"Position introuvable. Tape l'adresse à la place."}</p>`;
  }, {enableHighAccuracy:true, timeout:10000});
}
async function searchWorld(text){
  // Open-Meteo : villes du monde entier (utile pour les road trips hors de France)
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=fr&format=json&name="+encodeURIComponent(text));
  if(!r.ok) throw new Error(r.status);
  const d=await r.json();
  return (d.results||[]).filter(x=>x.country_code!=="FR").map(x=>({name:x.name, ctx:[x.admin1,x.country].filter(Boolean).join(", "), lat:x.latitude, lon:x.longitude}));
}
let searchSeq=0;
async function search(text){
  const res=document.getElementById("res"); if(!res) return; const seq=++searchSeq;
  res.innerHTML=`<p class="hint">Recherche…</p>`;
  const [fr,world]=await Promise.allSettled([searchFR(text),searchWorld(text)]);
  if(!document.getElementById("res") || seq!==searchSeq) return;
  const list=[...(fr.value||[]),...(world.value||[])].slice(0,8);
  if(fr.status==="rejected" && world.status==="rejected"){res.innerHTML=`<p class="err">Recherche impossible. Vérifie ta connexion internet puis réessaie.</p>`;return;}
  if(!list.length){res.innerHTML=`<p class="hint">Aucun lieu trouvé pour « ${esc(text)} ». Vérifie l'orthographe ou ajoute la ville.</p>`;return;}
  res.innerHTML=`<div class="results">${list.map((x,i)=>`<button data-pick="${i}">${esc(x.name)}<small>${esc(x.ctx)}</small></button>`).join("")}</div>`;
  res.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    state.draft.points.push(list[+b.dataset.pick]);
    render(); const nq=document.getElementById("q"); if(nq) nq.focus();
  });
}

function saveDraft(){
  const d=state.draft;
  if(d.points.length<2){toast("Ajoute au moins un départ et une arrivée");return;}
  if(!d.name.trim()) d.name=d.points[0].name+(d.retour.on?" ↔ ":" → ")+d.points.at(-1).name;
  if(d.isDefault) state.routes.forEach(r=>{ if(r.id!==d.id) r.isDefault=false; });
  const i=state.routes.findIndex(r=>r.id===d.id);
  if(i>=0) state.routes[i]=d; else state.routes.push(d);
  if(save()){state.draft=null;openDetail(d.id);toast("Itinéraire enregistré");}
}

/* ---------- équipement ---------- */
const GEAR_KEY="rouleoupas.gear.v1";
const CATS=["Haut","Bas","Mains","Pieds","Tête & cou","Pluie","Chauffant","Moto"];
// [nom, catégorie, temp. mini °C, temp. maxi °C, étanche, chauffant]
const PRESETS=[
  ["Veste été (mesh)","Haut",18,35,false,false],["Veste mi-saison","Haut",8,22,false,false],["Veste hiver","Haut",-5,12,true,false],
  ["Doublure thermique","Haut",-5,12,false,false],["Gilet chauffant","Chauffant",-10,10,false,true],["Pantalon moto","Bas",5,28,false,false],
  ["Pantalon de pluie","Pluie",-10,30,true,false],["Combinaison de pluie","Pluie",-10,30,true,false],["Gants été","Mains",18,35,false,false],
  ["Gants mi-saison","Mains",8,20,false,false],["Gants hiver","Mains",-5,10,true,false],["Gants chauffants","Chauffant",-10,8,true,true],
  ["Sur-gants de pluie","Pluie",-10,30,true,false],["Bottes étanches","Pieds",-5,25,true,false],["Sur-bottes","Pluie",-10,30,true,false],
  ["Tour de cou","Tête & cou",-10,15,false,false],["Cagoule","Tête & cou",-10,8,false,false],["Poignées chauffantes","Moto",-10,12,false,true]
];
function loadGear(){ try{ const g=JSON.parse(localStorage.getItem(GEAR_KEY)); if(Array.isArray(g)) return g; }catch(e){} return []; }
function saveGear(){ try{ localStorage.setItem(GEAR_KEY, JSON.stringify(state.gear)); return true; }catch(e){ toast("Enregistrement impossible sur cet appareil"); return false; } }
const gearFrom = p => ({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:p[0], cat:p[1], tMin:p[2], tMax:p[3], waterproof:p[4], heated:p[5], note:""});
const tempRange = g => `${g.tMin} à ${g.tMax} °C`;

function tabsBar(){
  return `<nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="trajets" aria-pressed="${state.tab==="trajets"}">Trajets</button>
    <button class="tab" data-tab="equipement" aria-pressed="${state.tab==="equipement"}">Équipement${state.gear.length?` · ${state.gear.length}`:""}</button>
    <button class="tab" data-tab="reglages" aria-pressed="${state.tab==="reglages"}">Réglages</button>
  </nav>`;
}
function bindTabs(){
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
}
function renderGear(){
  const owned=new Set(state.gear.map(g=>g.name.toLowerCase()));
  const presets=PRESETS.filter(p=>!owned.has(p[0].toLowerCase()));
  const groups=CATS.map(c=>({c, items:state.gear.filter(g=>g.cat===c)})).filter(x=>x.items.length);
  app.innerHTML = `
    <header class="top"><h1 class="brand">Roule <span>ou pas</span></h1></header>
    <div class="stack">
      <div class="eyebrow">Mon équipement · ${state.gear.length}</div>
      ${groups.length ? groups.map(gr=>`
        <div class="panel"><h3>${esc(gr.c)}</h3>
          <div class="gear-list">${gr.items.map(g=>`
            <button class="gear" data-gear="${esc(g.id)}">
              <span class="gear-name">${esc(g.name)}</span>
              <span class="chips"><span class="chip">${esc(tempRange(g))}</span>${g.waterproof?'<span class="chip">Étanche</span>':""}${g.heated?'<span class="chip accent">Chauffant</span>':""}</span>
              ${g.note?`<small class="hint">${esc(g.note)}</small>`:""}
            </button>`).join("")}</div></div>`).join("")
      : `<p class="hint">Ajoute ce que tu as dans ton placard moto. L'appli s'en servira pour te dire quoi mettre selon la météo du trajet.</p>`}
      ${presets.length?`<div class="panel"><h3>Ajout rapide</h3>
        <p class="hint">Touche un équipement que tu possèdes. Tu pourras ajuster ses réglages ensuite.</p>
        <div class="presets">${presets.map(p=>`<button class="preset" data-preset="${esc(p[0])}">+ ${esc(p[0])}</button>`).join("")}</div></div>`:""}
    </div>
    <button class="btn btn-primary fab" id="newgear">+ Autre équipement</button>
    ${tabsBar()}`;
  bindTabs();
  app.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>openGear(b.dataset.gear));
  app.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    const p=PRESETS.find(x=>x[0]===b.dataset.preset); state.gear.push(gearFrom(p)); saveGear(); render(); toast("Ajouté : "+p[0]);
  });
  document.getElementById("newgear").onclick=()=>openGear(null);
}
function openGear(id){
  const src=id?state.gear.find(g=>g.id===id):null;
  state.gearDraft = src ? {...src} : gearFrom(["","Haut",5,20,false,false]);
  state.gearNew=!src; state.confirmDelete=false; state.view="gear-edit"; render(); window.scrollTo(0,0);
}
function renderGearEdit(){
  const g=state.gearDraft;
  app.innerHTML = `
    <header class="top">
      <button class="icon-btn" id="back" aria-label="Retour">←</button>
      <div class="eyebrow">${state.gearNew?"Nouvel équipement":"Modifier l'équipement"}</div>
      <span style="width:40px"></span>
    </header>
    <div class="stack">
      <div class="field"><label for="g-name">Nom</label><input type="text" id="g-name" value="${esc(g.name)}" maxlength="50" placeholder="Ex. : Gants Rev'It hiver"></div>
      <div class="field"><label for="g-cat">Catégorie</label>
        <select id="g-cat">${CATS.map(c=>`<option ${c===g.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="panel">
        <h3>Confort</h3>
        <p class="hint">Températures entre lesquelles tu es bien avec cet équipement, en roulant.</p>
        <div class="row2">
          <div class="field"><label for="g-min">Mini (°C)</label><input type="number" inputmode="numeric" id="g-min" value="${g.tMin}" min="-30" max="45"></div>
          <div class="field"><label for="g-max">Maxi (°C)</label><input type="number" inputmode="numeric" id="g-max" value="${g.tMax}" min="-30" max="45"></div>
        </div>
        <label class="switch"><input type="checkbox" id="g-wp" ${g.waterproof?"checked":""}> Étanche à la pluie</label>
        <label class="switch"><input type="checkbox" id="g-heat" ${g.heated?"checked":""}> Chauffant</label>
      </div>
      <div class="field"><label for="g-note">Note (facultatif)</label><input type="text" id="g-note" value="${esc(g.note)}" maxlength="80" placeholder="Ex. : batterie à recharger"></div>
      <div class="bar">
        <button class="btn btn-primary" id="g-save">Enregistrer</button>
        ${state.gearNew?"":`<button class="btn btn-danger" id="g-del">Supprimer</button>`}
      </div>
      ${state.confirmDelete?`<div class="confirm"><span>Supprimer « ${esc(g.name)} » ?</span>
        <div class="bar"><button class="btn btn-danger" id="g-delyes">Oui, supprimer</button><button class="btn btn-ghost" id="g-delno">Annuler</button></div></div>`:""}
    </div>`;
  const $=id=>document.getElementById(id);
  const read=()=>{ g.name=$("g-name").value.trim(); g.cat=$("g-cat").value; g.tMin=Number($("g-min").value); g.tMax=Number($("g-max").value);
    g.waterproof=$("g-wp").checked; g.heated=$("g-heat").checked; g.note=$("g-note").value.trim(); };
  const leave=()=>{ state.gearDraft=null; state.view="list"; state.tab="equipement"; render(); };
  $("back").onclick=leave;
  $("g-save").onclick=()=>{
    read();
    if(!g.name){ toast("Donne un nom à cet équipement"); return; }
    if(!Number.isFinite(g.tMin)||!Number.isFinite(g.tMax)){ toast("Indique les températures mini et maxi"); return; }
    if(g.tMin>g.tMax) [g.tMin,g.tMax]=[g.tMax,g.tMin];
    const i=state.gear.findIndex(x=>x.id===g.id); if(i>=0) state.gear[i]=g; else state.gear.push(g);
    if(saveGear()){ leave(); toast("Équipement enregistré"); }
  };
  if($("g-del")) $("g-del").onclick=()=>{ read(); state.confirmDelete=true; render(); };
  if($("g-delyes")) $("g-delyes").onclick=()=>{ state.gear=state.gear.filter(x=>x.id!==g.id); saveGear(); leave(); toast("Équipement supprimé"); };
  if($("g-delno")) $("g-delno").onclick=()=>{ state.confirmDelete=false; render(); };
}

/* ---------- divers ---------- */
let tt; function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200);}
const app=document.getElementById("app");
function renderView(){
  if(state.view==="edit") return renderEditor();
  if(state.view==="detail") return renderDetail();
  if(state.view==="gear-edit") return renderGearEdit();
  return state.tab==="equipement" ? renderGear() : state.tab==="reglages" ? renderRules() : renderList();
}
function render(){
  state.pendingMaps=[];
  renderView();
  if(newVersion){ app.insertAdjacentHTML("afterbegin", updateBanner()); bindUpdate(); }
  if(state.view==="list") app.insertAdjacentHTML("beforeend", `<p class="version">Version ${APP_VERSION}</p>`);
  mountMaps();
}
state.rules=loadRules();
render();
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
</script>
